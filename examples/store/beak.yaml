# Beak project configuration. Every key is optional — delete this file and
# Beak still boots, titling the panel after the package.
name: Beak Store

api:
  # The origin the panel calls. `auto` calls the origin the panel was served
  # from, which is what a single-host deployment wants.
  baseUrl: http://localhost:8080

# Presentation for a discovered resource. Anything not listed here is still
# discovered — it just uses the default icon and a title-cased label.
resources:
  products:
    icon: package
    section: Catalog
  categories:
    icon: folderTree
    section: Catalog
  tags:
    icon: tag
    section: Catalog
  roast_profiles:
    icon: flame
    section: Catalog
  orders:
    icon: receipt
    section: Sales
  users:
    icon: users
    section: Sales
  # Lines are always reached through their order, never from the sidebar —
  # but they keep their API, their model and their relationships.
  order_items:
    hidden: true
