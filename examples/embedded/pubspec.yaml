name: embedded
description: A Beak admin panel.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  beak:
    path: ../../packages/beak
  # An S3 upload driver is a plug-in: beak_backend depends on no driver
  # package, so an app that wants one declares it and registers it in
  # lib/server.dart.
  beak_storage_s3:
    path: ../../packages/beak_storage_s3
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

# The S3 driver's `minio` pins `xml ^6`, while `image` (used by Beak's upload
# transforms) pins `xml ^7`. Both work against 7; this says so, in the one
# example that needs S3 — which is why the other examples' pubspecs stay
# short.
dependency_overrides:
  xml: ^7.0.1
