# The superdashboard's presentation: which of the 49 models earn a sidebar
# entry, under which heading, behind which icon.
name: Beak Superdashboard

api:
  baseUrl: http://localhost:8180

server:
  # The store example already has 8080, and both run from this repository.
  port: 8180

resources:
  # Store
  products:
    icon: package
    section: Store
  categories:
    icon: folderTree
    section: Store
  tags:
    icon: tag
    section: Store
  orders:
    icon: shoppingCart
    section: Store
  transactions:
    icon: creditCard
    section: Store
  # People
  users:
    icon: users
    section: People
  team_members:
    icon: userCheck
    section: People
  activities:
    icon: activity
    section: People
  skills:
    icon: award
    section: People
  # Projects
  calendar_events:
    icon: calendar
    section: Projects
  cards:
    icon: trello
    section: Projects
  boards:
    icon: layoutGrid
    section: Projects
  invoices:
    icon: fileText
    section: Projects
  # Content
  pricing_plans:
    icon: dollarSign
    section: Content
  faqs:
    icon: helpCircle
    section: Content
  media_assets:
    icon: image
    section: Content
  notifications:
    icon: bell
    section: Content
  # Everything below is reached through the resource that owns it, or
  # through a screen, and keeps its API, its model and its relationships.
  activity_heatmap:
    hidden: true
  board_columns:
    hidden: true
  card_labels:
    hidden: true
  chat_attachments:
    hidden: true
  chat_messages:
    hidden: true
  conversation_participants:
    hidden: true
  conversations:
    hidden: true
  country_stats:
    hidden: true
  email_attachments:
    hidden: true
  emails:
    hidden: true
  event_categories:
    hidden: true
  faq_categories:
    hidden: true
  file_folders:
    hidden: true
  file_shares:
    hidden: true
  files:
    hidden: true
  invoice_items:
    hidden: true
  mail_folders:
    hidden: true
  mail_labels:
    hidden: true
  office_locations:
    hidden: true
  order_comments:
    hidden: true
  order_events:
    hidden: true
  order_items:
    hidden: true
  plan_features:
    hidden: true
  price_candles:
    hidden: true
  price_rules:
    hidden: true
  product_images:
    hidden: true
  product_reviews:
    hidden: true
  product_variants:
    hidden: true
  purchase_sources:
    hidden: true
  storage_accounts:
    hidden: true
  time_series_points:
    hidden: true
  user_attachments:
    hidden: true
