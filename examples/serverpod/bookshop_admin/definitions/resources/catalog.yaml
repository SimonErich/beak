# The bookshop catalogue. Staff read, create and update; nobody deletes, so
# removing a book or an author is a deliberate server change.
area: catalog
resources:
  Book:
    display: title
    operations: [read, create, update]
    write: configuration
    writeFields: [title, isbn, format, priceInCents, stock, publishedOn, authorId]
  Author:
    display: name
    operations: [read, create, update]
    write: configuration
    writeFields: [name, bio, website]
