# Beak project configuration of the bookshop admin. `beak generate` reads the
# Serverpod models, the newest migration and the definition classes in
# definitions/, and writes a part next to each class.
name: Bookshop Admin

# Model, field and enum names in every language, keyed by Dart names
# (`book.title`). beak generate writes them onto the generated models.
labels: {path: labels, template: en, require: shown}

serverpod:
  server: ../bookshop_server
  models: [lib/src]
  migrations: migrations

generate:
  definitions: definitions
  handlers: ../bookshop_server/lib/src/beak/generated
  prefix: Bookshop
  areas:
    catalog: {read: bookshop.staff, write: bookshop.staff}
