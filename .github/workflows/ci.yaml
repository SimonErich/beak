name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a branch/PR, but always let main finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Analyze & format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A single-repo checkout is the whole point: obers_ui is pinned by git
      # commit in the pubspecs, so nothing has to be placed beside this repo.
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Activate melos
        run: dart pub global activate melos 6.3.3
      - name: Bootstrap
        run: melos bootstrap
      # No separate workspace-tooling `pub get`: `melos run analyze-root`
      # resolves the root itself, so a fresh clone needs no extra step.
      # `analyze` also runs `beak doctor` over every example, which is what
      # catches an emitter change that left the checked-in generated code
      # stale — nothing else in the gate reads it.
      - name: Analyze (includes the material, web-safety and example guards)
        run: melos run analyze
      - name: Format check
        run: melos run format-check

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The guard in `melos run analyze` is static; this job is the empirical
      # half. dart:io compiles on web and only fails at runtime, so a real
      # build is what proves the panel graph stayed server-free.
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Activate melos
        run: dart pub global activate melos 6.3.3
      - name: Bootstrap
        run: melos bootstrap
      - name: Build the quickstart panel for web
        run: flutter build web --release
        working-directory: examples/quickstart
      - name: Build the store panel for web
        run: flutter build web --release
        working-directory: examples/store
      - name: Build the superdashboard panel for web
        run: flutter build web --release
        working-directory: examples/superdashboard

  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Activate melos
        run: dart pub global activate melos 6.3.3
      - name: Bootstrap
        run: melos bootstrap
      - name: Test
        run: melos run test
      - name: Coverage gate
        run: melos run coverage
      # The service-backed suites assert the same things on a real driver that
      # the main gate asserts on SQLite, so they run after it rather than
      # gating it.
      - name: Start services (Postgres + MinIO)
        run: melos run up
      - name: Service-backed suites
        run: melos run test-e2e
      # The vendored drivers sit outside the melos scope, so `melos run test`
      # never reaches them. This is where ALTER TABLE and `EXPLAIN … USING
      # INDEX` are proven against a real server rather than a compiler golden.
      - name: Vendored driver suites (Postgres)
        run: melos run test-worm-drivers
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage/lcov.info
            examples/*/coverage/lcov.info
          retention-days: 7
      - name: Tear down services
        if: always()
        run: docker compose down -v
