name: ci

# Every job that resolves packages fetches obers_ui, obers_ui_autoforms and
# obers_ui_charts from github.com/SimonErich/obers_ui at the commit pinned in
# the pubspecs. That commit has to be pushed there, or `pub get` fails in every
# job below. It also has to be new enough for beak_frontend to compile, and the
# pinned one (c956d25) is not: these jobs fail on it until the obers_ui changes
# are pushed and the SHA is bumped in every pubspec (`test/obers_ui_pin_test.dart`
# keeps the copies identical):
#   - static (`flutter analyze` of beak_frontend, showcase, foodio-adminpanel)
#   - test (beak_frontend and every Flutter example compile against it)
#   - web, showcase-web, foodio-web (they build the panel)
#   - serverpod-admin (the admin app compiles the panel)
# The jobs that need no panel (install-smoke, serverpod-example) do not depend on
# it. Nothing here reads a sibling checkout, so `melos run link-obers-ui` is a
# local-only tool.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a branch/PR, but always let main finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Analyze & format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A single-repo checkout is the whole point: obers_ui is pinned by git
      # commit in the pubspecs, so nothing has to be placed beside this repo.
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Activate melos
        run: dart pub global activate melos 6.3.3
      # melos bootstraps in parallel, and on a cold pub cache two `pub get`s
      # check out the same obers_ui commit at once and collide on git's
      # index.lock. Resolving one Flutter package first puts the checkout in
      # the cache; the parallel bootstrap then only reads it.
      - name: Warm the pub git cache
        run: cd packages/beak_frontend && flutter pub get
      - name: Bootstrap
        run: melos bootstrap
      # No separate workspace-tooling `pub get`: `melos run analyze-root`
      # resolves the root itself, so a fresh clone needs no extra step.
      # `analyze` also runs `beak doctor` over every example, which is what
      # catches an emitter change that left the checked-in generated code
      # stale — nothing else in the gate reads it. It runs the agent docs
      # bundle check too (`check-agent-docs`): a change to docs/, mkdocs.yml,
      # CHANGELOG.md or the version fails here until `melos run agent-docs`
      # has regenerated the committed bundle.
      - name: Analyze (material, web-safety, hook-widget, docs, example and agent-docs guards)
        run: melos run analyze
      - name: Format check
        run: melos run format-check

  web:
    name: Web build
    runs-on: ubuntu-latest
    # Two maintained example release builds.
    timeout-minutes: 35
    steps:
      # The guard in `melos run analyze` is static; this job is the empirical
      # half. dart:io compiles on web and only fails at runtime, so a real
      # build is what proves the panel graph stayed server-free.
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Activate melos
        run: dart pub global activate melos 6.3.3
      # melos bootstraps in parallel, and on a cold pub cache two `pub get`s
      # check out the same obers_ui commit at once and collide on git's
      # index.lock. Resolving one Flutter package first puts the checkout in
      # the cache; the parallel bootstrap then only reads it.
      - name: Warm the pub git cache
        run: cd packages/beak_frontend && flutter pub get
      - name: Bootstrap
        run: melos bootstrap
      - name: Build the quickstart panel for web
        run: flutter build web --release
        working-directory: examples/quickstart
      - name: Build the declarative shop panel for web
        run: flutter build web --release
        working-directory: examples/clean_beak_config

  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    # The full gate plus the service-backed and vendored suites.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Activate melos
        run: dart pub global activate melos 6.3.3
      # melos bootstraps in parallel, and on a cold pub cache two `pub get`s
      # check out the same obers_ui commit at once and collide on git's
      # index.lock. Resolving one Flutter package first puts the checkout in
      # the cache; the parallel bootstrap then only reads it.
      - name: Warm the pub git cache
        run: cd packages/beak_frontend && flutter pub get
      - name: Bootstrap
        run: melos bootstrap
      - name: Test
        run: melos run test
      - name: Coverage gate
        run: melos run coverage
      # The service-backed suites assert the same things on a real driver that
      # the main gate asserts on SQLite, so they run after it rather than
      # gating it.
      - name: Start services (Postgres + MinIO)
        run: melos run up
      - name: Service-backed suites
        run: melos run test-e2e
      # The vendored worm packages sit outside the melos scope, so
      # `melos run test` never reaches them, and they are still edited here.
      # This is also where ALTER TABLE and `EXPLAIN … USING INDEX` are proven
      # against a real server rather than a compiler golden.
      - name: Vendored worm suites
        run: melos run test-worm
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage/lcov.info
            examples/*/coverage/lcov.info
          retention-days: 7
      - name: Tear down services
        if: always()
        run: docker compose down -v

  # The path a newcomer takes, on a machine that has never bootstrapped this
  # repository: install the CLI from source, create a project against this
  # checkout, generate its wiring. It does not compile the panel, so it does not
  # need an obers_ui commit newer than the pin.
  install-smoke:
    name: Install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Install the CLI from source
        run: dart pub global activate --source path packages/beak_cli
      - name: Put pub's bin directory on the path
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Print the version
        run: beak --version
      # `--beak-path` points the new project at this checkout: the default git
      # dependency needs a v<version> tag that only exists after a release.
      - name: Create a project
        run: beak create smoke_app --beak-path "$GITHUB_WORKSPACE"
        working-directory: ${{ runner.temp }}
      - name: Prepare the project
        run: beak prepare
        working-directory: ${{ runner.temp }}/smoke_app

  showcase-web:
    name: Web build (showcase)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Activate melos
        run: dart pub global activate melos 6.3.3
      # melos bootstraps in parallel, and on a cold pub cache two `pub get`s
      # check out the same obers_ui commit at once and collide on git's
      # index.lock. Resolving one Flutter package first puts the checkout in
      # the cache; the parallel bootstrap then only reads it.
      - name: Warm the pub git cache
        run: cd packages/beak_frontend && flutter pub get
      - name: Bootstrap
        run: melos bootstrap
      - name: Build the showcase panel for web
        run: flutter build web --release
        working-directory: examples/showcase

  foodio-web:
    name: Web build (foodio)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Activate melos
        run: dart pub global activate melos 6.3.3
      # melos bootstraps in parallel, and on a cold pub cache two `pub get`s
      # check out the same obers_ui commit at once and collide on git's
      # index.lock. Resolving one Flutter package first puts the checkout in
      # the cache; the parallel bootstrap then only reads it.
      - name: Warm the pub git cache
        run: cd packages/beak_frontend && flutter pub get
      - name: Bootstrap
        run: melos bootstrap
      - name: Build the foodio admin panel for web
        run: flutter build web --release
        working-directory: examples/foodio-adminpanel

  # examples/serverpod is a pub workspace of its own with Serverpod 4's exact
  # pins, so melos neither bootstraps nor gates it (see `ignore:` in
  # melos.yaml) and these two jobs are the only ones that touch it. It needs
  # Dart 3.12.2 or newer, which the stable channel has.
  #
  # Serverpod reads config/passwords.yaml when a test file loads, and that file
  # is git-ignored, so the job copies the committed example first. The
  # integration suites run on the embedded Postgres Serverpod downloads from
  # GitHub Releases on first use (no Docker, no service container): they are
  # the proof that the tunnel gate refuses a caller without the beak.admin
  # scope, that the policy denies what it does not allow, and that
  # ServerpodSessionAdapter passes worm's adapter contract.
  serverpod-example:
    name: Serverpod example
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Cache the embedded Postgres binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/serverpod/pg-binaries
          key: ${{ runner.os }}-serverpod-pg-${{ hashFiles('examples/serverpod/bookshop_server/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-serverpod-pg-
      - name: Resolve the workspace
        run: flutter pub get
        working-directory: examples/serverpod
      # `melos run analyze` never reaches this workspace (see `ignore:` in
      # melos.yaml), so its pure-Dart members and the template app are analyzed
      # here. bookshop_admin is analyzed in `serverpod-admin`: it compiles the
      # panel.
      - name: Analyze the server, the Beak schema package and the client
        run: dart analyze --fatal-infos --fatal-warnings bookshop_server bookshop_beak bookshop_client
        working-directory: examples/serverpod
      - name: Analyze the template app
        run: flutter analyze --fatal-infos --fatal-warnings
        working-directory: examples/serverpod/bookshop_flutter
      - name: Local secrets (git-ignored in a real checkout)
        run: cp config/passwords.example.yaml config/passwords.yaml
        working-directory: examples/serverpod/bookshop_server
      - name: Unit tests (no server, no database)
        run: dart test --exclude-tags integration
        working-directory: examples/serverpod/bookshop_server
      - name: Integration tests (embedded Postgres)
        run: dart test --tags integration
        working-directory: examples/serverpod/bookshop_server

  # bookshop_admin's widget tests compile the panel, so this job fails with the
  # other panel jobs until the obers_ui pin has the APIs beak_frontend calls.
  serverpod-admin:
    name: Serverpod admin app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Resolve the workspace
        run: flutter pub get
        working-directory: examples/serverpod
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
        working-directory: examples/serverpod/bookshop_admin
      - name: Widget tests (a fake dispatch, no server)
        run: flutter test
        working-directory: examples/serverpod/bookshop_admin
