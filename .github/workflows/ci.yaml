name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a branch/PR, but always let main finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    name: Analyze & format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # A single-repo checkout is the whole point: obers_ui is pinned by git
      # commit in the pubspecs, so nothing has to be placed beside this repo.
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Activate melos
        run: dart pub global activate melos 6.3.3
      - name: Bootstrap
        run: melos bootstrap
      # melos bootstrap only resolves packages/** and apps/**; the workspace
      # tooling in tool/ and test/ lives under the root pubspec (dev_dependencies:
      # test, lints), which `dart analyze` needs pre-resolved (unlike `dart test`
      # / `dart run`, it does not fetch packages on its own).
      - name: Pub get (workspace tooling)
        run: dart pub get
      - name: Analyze (includes the material and web-safety guards)
        run: melos run analyze
      - name: Format check
        run: melos run format-check

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The guard in `melos run analyze` is static; this job is the empirical
      # half. dart:io compiles on web and only fails at runtime, so a real
      # build is what proves the panel graph stayed server-free.
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Activate melos
        run: dart pub global activate melos 6.3.3
      - name: Bootstrap
        run: melos bootstrap
      - name: Build the reference panel for web
        run: flutter build web --release
        working-directory: apps/reference_admin
      - name: Build the superdashboard panel for web
        run: flutter build web --release
        working-directory: apps/beak_superdashboard

  test:
    name: Test & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: ${{ runner.os }}-pub-
      - name: Activate melos
        run: dart pub global activate melos 6.3.3
      - name: Bootstrap
        run: melos bootstrap
      - name: Start services (Postgres + MinIO)
        run: melos run up
      - name: Test
        run: melos run test
      - name: Coverage gate
        run: melos run coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            packages/*/coverage/lcov.info
            apps/*/coverage/lcov.info
          retention-days: 7
      - name: Tear down services
        if: always()
        run: docker compose down -v
