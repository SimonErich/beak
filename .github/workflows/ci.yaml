name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beak
    steps:
      - name: Checkout beak
        uses: actions/checkout@v4
        with:
          path: beak
      # beak_frontend and the apps reference obers_ui by relative path one level
      # above the repo root (../obers_ui), mirroring the local ~/Flutters layout.
      # Override the repository via the OBERS_UI_REPO repo variable if it moves.
      - name: Checkout obers_ui (sibling path dependency)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.OBERS_UI_REPO || 'marqably/obers_ui' }}
          token: ${{ secrets.OBERS_UI_TOKEN || github.token }}
          path: obers_ui
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Activate melos
        run: dart pub global activate melos 6.3.3
      - name: Bootstrap
        run: melos bootstrap
      - name: Start services (Postgres + MinIO)
        run: melos run up
      - name: Analyze (includes material-import guard)
        run: melos run analyze
      - name: Format check
        run: melos run format-check
      - name: Test
        run: melos run test
      - name: Coverage gate
        run: melos run coverage
      - name: Tear down services
        if: always()
        run: docker compose down -v
