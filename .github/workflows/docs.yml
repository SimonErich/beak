name: Documentation

# Builds the MkDocs site from docs/ and publishes it to GitHub Pages.
# Mirrors the obers_ui docs workflow. The Dartdoc API reference is built per
# package and mounted under /api/.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  # The build is the docs' only structural gate — broken links, missing nav
  # entries, snippet targets that moved. Running it after merge means main
  # breaks first and someone finds out later.
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "examples/**"
      - "packages/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs and plugins
        run: pip install mkdocs-material mkdocs-minify-plugin mkdocs-redirects

      - uses: dart-lang/setup-dart@v1

      # `dart run` fetches on its own, but the checker reads the tree rather
      # than the packages, so a bare resolve is all it needs.
      - name: Check the docs
        run: dart pub get && dart run tool/check_docs.dart

      # --strict fails the build on any broken internal link or page missing
      # from the nav. This is the docs' structural gate.
      - name: Build MkDocs
        run: mkdocs build --strict --site-dir _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    # Only main publishes; a pull request builds to prove it still builds.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
