name: Documentation

# Builds the MkDocs site from docs/ and publishes it to GitHub Pages.
# Mirrors the obers_ui docs workflow. The Dartdoc API reference is built per
# package and mounted under /api/.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs and plugins
        run: pip install mkdocs-material mkdocs-minify-plugin

      # --strict fails the build on any broken internal link or page missing
      # from the nav. This is the docs' structural gate.
      - name: Build MkDocs
        run: mkdocs build --strict --site-dir _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
