name: Bug report
description: Report a defect in a Beak package.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please confirm the bug against the latest `main`
        first. For security issues, use private reporting instead (see SECURITY.md).
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - beak (umbrella package)
        - beak_core
        - beak_frontend
        - beak_backend
        - beak_cli
        - beak_test
        - beak_image
        - beak_storage_s3
        - beak_storage_ftp
        - beak_serverpod
        - beak_serverpod_flutter
        - beak_serverpod_generator
        - examples/quickstart
        - examples/clean_beak_config
        - examples/foodio-adminpanel
        - not sure / multiple
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal, self-contained repro (code snippet or failing test) is ideal.
      placeholder: |
        1. Define a model with …
        2. Call …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Dart/Flutter versions (`dart --version`, `flutter --version`), OS, and the Beak commit/version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      render: shell
