# Host ports are prefixed with 2 (25432, 29000, …) because this dev host
# already binds the default ports (system postgres on 5432, other stacks on
# 9000/9001/8081). Override via BEAK_*_PORT env vars if these ever collide.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beak
      POSTGRES_PASSWORD: beak
      POSTGRES_DB: beak
    ports: ["${BEAK_PG_PORT:-25432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beak"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: beak
      MINIO_ROOT_PASSWORD: beaksecret
    ports: ["${BEAK_S3_PORT:-29000}:9000", "${BEAK_S3_CONSOLE_PORT:-29001}:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["miniodata:/data"]
  # One-shot bucket init. Profiled so `docker compose up -d --wait` doesn't
  # count its (successful) exit as a failure; `melos run up` targets it
  # explicitly after MinIO is healthy, which auto-activates the profile.
  createbuckets:
    image: minio/mc:latest
    profiles: ["init"]
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 beak beaksecret &&
      mc mb -p local/beak-uploads &&
      mc anonymous set download local/beak-uploads || true"
  pgweb:
    image: sosedoff/pgweb:latest
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      PGWEB_DATABASE_URL: postgres://beak:beak@postgres:5432/beak?sslmode=disable
    ports: ["${BEAK_PGWEB_PORT:-28081}:8081"]
volumes: { pgdata: {}, miniodata: {} }
