site_name: Beak
site_description: "Beak is a low-code, configuration-driven admin-panel framework for Dart and Flutter. Define a model once, get a whole dashboard."
site_url: https://simonerich.github.io/beak/
repo_url: https://github.com/SimonErich/beak
repo_name: SimonErich/beak
edit_uri: edit/main/docs/

docs_dir: docs

# Authoring aids that ship in the repo but are not part of the built site.
exclude_docs: |
  _internal/
  architecture/how-beak-was-built.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Quote source rather than copying it: `--8<-- "examples/store/lib/..."`
  # reads the file at build time, and `check_paths` fails the build when the
  # file moves instead of publishing an empty block.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
      dedent_subsections: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - minify:
      minify_html: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SimonErich/beak

