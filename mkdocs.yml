site_name: Beak
site_description: "Beak is a low-code, configuration-driven admin-panel framework for Dart and Flutter. Define a model once, get a whole dashboard."
site_url: https://simonerich.github.io/beak/
repo_url: https://github.com/SimonErich/beak
repo_name: SimonErich/beak
edit_uri: edit/main/docs/

docs_dir: docs

# Authoring aids that ship in the repo but are not part of the built site.
exclude_docs: |
  _internal/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Quote source rather than copying it: `--8<-- "examples/clean_beak_config/lib/..."`
  # reads the file at build time, and `check_paths` fails the build when the
  # file moves instead of publishing an empty block.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
      dedent_subsections: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  # The site is published, so a moved page keeps its old address working.
  # The tutorial went from ten chapters to six; every old slug lands on the
  # chapter that now covers it.
  - redirects:
      redirect_maps:
        tutorial/01-hatch-the-project.md: tutorial/01-your-first-resource.md
        tutorial/02-first-model-and-migration.md: tutorial/01-your-first-resource.md
        tutorial/03-the-panel-comes-alive.md: tutorial/01-your-first-resource.md
        tutorial/04-relationships-and-rich-columns.md: tutorial/03-relationships.md
        tutorial/05-seeding-a-flock-of-data.md: tutorial/04-seeding-and-the-api.md
        tutorial/06-filters-actions-and-view-modes.md: tutorial/05-shaping-the-panel.md
        tutorial/07-a-custom-dashboard.md: tutorial/05-shaping-the-panel.md
        tutorial/08-forms-wizards-and-dual-mode-detail.md: tutorial/05-shaping-the-panel.md
        tutorial/09-auth-theming-and-polish.md: tutorial/06-auth-tests-and-shipping.md
        tutorial/10-wrap-up.md: tutorial/06-auth-tests-and-shipping.md
        # The recipe page became a section, one addressable page per recipe.
        guides/common-recipes.md: recipes/index.md
  - minify:
      minify_html: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SimonErich/beak

