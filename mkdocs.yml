site_name: Beak
site_description: "Beak is a low-code, configuration-driven admin-panel framework for Dart and Flutter. Define a model once, get a whole dashboard."
site_url: https://simonerich.github.io/beak/
repo_url: https://github.com/SimonErich/beak
repo_name: SimonErich/beak
edit_uri: edit/main/docs/

docs_dir: docs

# Authoring aids that ship in the repo but are not part of the built site.
exclude_docs: |
  _internal/
  _agents/
  requirements.txt

# With `mkdocs build --strict` every warning below is a failure: a page left out
# of the nav, a link that resolves to nothing, an anchor that does not exist.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Quote source rather than copying it: `--8<-- "examples/clean_beak_config/lib/..."`
  # reads the file at build time, and `check_paths` fails the build when the
  # file moves instead of publishing an empty block.
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
      dedent_subsections: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  # /llms.txt, /llms-full.txt and a Markdown twin of every listed page (at
  # <page-url>index.md) are generated at build time. A `*` in a glob crosses
  # directories, and the sections list pages alphabetically by path, not in nav
  # order. tool/check_docs.dart fails when a page matches no glob or a glob
  # matches no page.
  - llmstxt:
      markdown_description: >-
        Beak is a configuration-driven admin framework for Dart and Flutter.
        Annotated schema classes generate typed field references such as
        ProductModel.name, a Shelf REST API with graph commits, migrations and a
        Flutter panel built from BeakResource screens. Users never write string
        field references or touch dynamic.
      full_output: llms-full.txt
      sections:
        Start:
          - index.md
          - start-here/*.md
        Learn:
          - learn/index.md
          - tutorial/*.md
          - examples/*.md
          - concepts/*.md
        Guides:
          - guides/index.md
          - models/*.md
          - panel/*.md
          - forms/*.md
          - blocks/*.md
          - theming/*.md
          - backend/*.md
          - extending/*.md
          - shipping/*.md
          - recipes/*.md
        Serverpod:
          - serverpod/*.md
        Reference:
          - reference/*.md
        AI directory:
          - ai/*.md
        Optional:
          - contributing/*.md
          - architecture/*.md
  # The site is published, so a moved page keeps its old address working.
  # Every path the site has ever served is listed in
  # docs/_internal/url-manifest.txt, and tool/check_docs.dart fails when one of
  # them is neither a page nor a key below.
  - redirects:
      redirect_maps:
        # The tutorial went from ten chapters to six; every old slug lands on
        # the chapter that now covers it, and the recipe page became a section.
        tutorial/01-hatch-the-project.md: tutorial/01-your-first-resource.md
        tutorial/02-first-model-and-migration.md: tutorial/01-your-first-resource.md
        tutorial/03-the-panel-comes-alive.md: tutorial/01-your-first-resource.md
        tutorial/04-relationships-and-rich-columns.md: tutorial/03-relationships.md
        tutorial/05-seeding-a-flock-of-data.md: tutorial/04-seeding-and-the-api.md
        tutorial/06-filters-actions-and-view-modes.md: tutorial/05-shaping-the-panel.md
        tutorial/07-a-custom-dashboard.md: tutorial/05-shaping-the-panel.md
        tutorial/08-forms-wizards-and-dual-mode-detail.md: tutorial/05-shaping-the-panel.md
        tutorial/09-auth-theming-and-polish.md: tutorial/06-auth-tests-and-shipping.md
        tutorial/10-wrap-up.md: tutorial/06-auth-tests-and-shipping.md
        guides/common-recipes.md: recipes/index.md
        # Pages that moved to a new home in the 0.9 restructure.
        architecture/foodio-composition.md: examples/foodio.md
        blocks/display-blocks.md: blocks/content-blocks.md
        charts/chart-basics.md: blocks/charts.md
        charts/maps.md: blocks/maps.md
        charts/population-summaries.md: blocks/summaries.md
        deployment/dev-infrastructure.md: contributing/dev-infrastructure.md
        deployment/environment-and-config.md: shipping/environment-and-config.md
        deployment/going-to-production.md: shipping/going-to-production.md
        deployment/index.md: shipping/index.md
        deployment/working-with-obers-ui.md: contributing/working-with-obers-ui.md
        guides/performance.md: shipping/performance.md
        guides/security.md: shipping/security.md
        guides/testing.md: shipping/testing.md
        guides/working-with-ai-agents.md: ai/setup.md
        models/column-types.md: models/fields.md
        models/validation-rules.md: models/validation.md
        panel/detail-and-dual-mode.md: forms/detail-views.md
        panel/drafts-and-review.md: forms/drafts-and-review.md
        panel/forms.md: forms/form-screens.md
        panel/import-and-bulk-edit.md: forms/imports-and-bulk-edits.md
        panel/media-galleries.md: forms/uploads-and-galleries.md
        panel/multi-step-forms.md: forms/multi-step-forms.md
        panel/record-documents.md: forms/record-documents.md
        panel/the-navigation-shell.md: panel/navigation.md
        panel/workflow-presentations.md: forms/workflow-presentations.md
        reference/blocks-index.md: reference/blocks.md
        reference/column-types.md: reference/field-types.md
        reference/configuration-options.md: reference/configuration.md
        # Pages merged into another page.
        backend/the-data-source-seam.md: architecture/data-source-seam.md
        backend/the-generated-api.md: reference/rest-api.md
        blocks/the-widget-escape-hatch.md: extending/custom-blocks-and-widgets.md
        blocks/ui-kit-blocks.md: blocks/content-blocks.md
        # The target keeps its fragment (verified on redirects 1.2.3). The Charts
        # page must carry an "Advanced charts" heading for it to land.
        charts/advanced-charts.md: blocks/charts.md#advanced-charts
        charts/index.md: blocks/charts.md
        concepts/rendering-per-surface.md: concepts/the-one-definition-promise.md
        contributing/writing-a-storage-driver.md: extending/custom-storage-drivers.md
        extending/custom-screens-and-pages.md: panel/custom-screens.md
        models/column-basics.md: models/fields.md
        models/escape-hatches.md: extending/index.md
        models/the-registry.md: models/generated-code.md
        start-here/index.md: index.md
        theming/the-shell.md: panel/navigation.md
  - minify:
      minify_html: true

