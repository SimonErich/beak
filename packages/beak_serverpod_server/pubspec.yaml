name: beak_serverpod_server
description: >-
  Runs Beak inside a Serverpod 4 server: a worm adapter over the request
  Session's own database pool and transactions, and the gated engine that
  serves Beak's API through one endpoint method.
version: 0.9.0
publish_to: none
repository: https://github.com/SimonErich/beak/tree/main/packages/beak_serverpod_server
homepage: https://github.com/SimonErich/beak
issue_tracker: https://github.com/SimonErich/beak/issues
topics: [admin-panel, backend, serverpod]

environment:
  # Serverpod 4.0.3 itself requires ^3.12.2.
  sdk: ^3.12.2

dependencies:
  beak_backend:
    path: ../beak_backend
  beak_core:
    path: ../beak_core
  beak_serverpod:
    path: ../beak_serverpod
  serverpod: '>=4.0.3 <5.0.0'
  shelf: ^1.4.2
  worm:
    path: ../worm
  worm_postgres:
    path: ../worm_postgres

dev_dependencies:
  lints: ^6.0.0
  mocktail: ^1.0.4
  test: ^1.25.6
