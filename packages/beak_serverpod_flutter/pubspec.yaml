name: beak_serverpod_flutter
description: >-
  The Flutter side of Beak on Serverpod 4: Beak's sign-in screens over
  Serverpod's email login, and the client that carries the admin app's requests
  through one Serverpod endpoint call.
version: 0.9.0
publish_to: none
repository: https://github.com/SimonErich/beak/tree/main/packages/beak_serverpod_flutter
homepage: https://github.com/SimonErich/beak
issue_tracker: https://github.com/SimonErich/beak/issues
topics: [admin-panel, serverpod, flutter]

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  beak_core:
    path: ../beak_core
  beak_frontend:
    path: ../beak_frontend
  beak_serverpod:
    path: ../beak_serverpod
  flutter:
    sdk: flutter
  serverpod_auth_core_flutter: '>=4.0.3 <5.0.0'
  serverpod_auth_idp_client: '>=4.0.3 <5.0.0'
  serverpod_client: '>=4.0.3 <5.0.0'
  signals: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  http: ^1.6.0
  lints: ^6.0.0
  mocktail: ^1.0.4
