name: beak_image
description: >-
  Image transform runner for Beak — executes BeakImageTransform pipelines
  (resize, format re-encode, thumbnails) using package:image.
version: 0.9.0
publish_to: none
repository: https://github.com/SimonErich/beak/tree/main/packages/beak_image
homepage: https://github.com/SimonErich/beak
issue_tracker: https://github.com/SimonErich/beak/issues
topics: [image, thumbnail, storage, transform]

environment:
  sdk: ^3.11.0

dependencies:
  beak_core:
    path: ../beak_core
  image: 4.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
