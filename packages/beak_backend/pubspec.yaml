name: beak_backend
description: >-
  Shelf server for Beak — auto CRUD, graph commits, uploads, auth, and export
  on top of the source-agnostic data layer.
version: 0.9.0
publish_to: none
repository: https://github.com/SimonErich/beak/tree/main/packages/beak_backend
homepage: https://github.com/SimonErich/beak
issue_tracker: https://github.com/SimonErich/beak/issues
topics: [admin-panel, backend, shelf, rest]

environment:
  sdk: ^3.11.0

dependencies:
  beak_core:
    path: ../beak_core
  beak_image:
    path: ../beak_image
  crypto: ^3.0.7
  meta: ^1.16.0
  mime: ^2.0.0
  shelf: ^1.4.2
  shelf_multipart: ^2.0.1
  shelf_router: ^1.1.4
  worm:
    path: ../worm
  worm_postgres:
    path: ../worm_postgres
  # The zero-setup default: a DATABASE_URL-less project runs on a file.
  worm_sqlite:
    path: ../worm_sqlite

dev_dependencies:
  # Dev-only: the MinIO integration suite exercises the `s3` plug-in driver.
  # Deliberately NOT a real dependency — see storage_wiring.dart.
  beak_storage_s3:
    path: ../beak_storage_s3
  # The shared BeakDataSource contract, run against WormDataSource.
  beak_test:
    path: ../beak_test
  image: ^4.9.1
  lints: ^6.0.0
  test: ^1.25.6
