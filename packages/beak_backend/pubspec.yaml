name: beak_backend
description: >-
  Shelf server for Beak — auto CRUD, uploads, auth, search, and export on top
  of the source-agnostic data layer.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  beak_core:
    path: ../beak_core
  meta: ^1.16.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  worm:
    path: ../worm
  worm_postgres:
    path: ../worm_postgres

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
