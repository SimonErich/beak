name: beak_backend
description: >-
  Shelf server for Beak — auto CRUD, uploads, auth, search, and export on top
  of the source-agnostic data layer.
version: 0.0.1
publish_to: none
repository: https://github.com/marqably/beak/tree/main/packages/beak_backend
homepage: https://github.com/marqably/beak
issue_tracker: https://github.com/marqably/beak/issues
topics: [admin-panel, backend, shelf, rest]

environment:
  sdk: ^3.11.0

dependencies:
  beak_core:
    path: ../beak_core
  beak_image:
    path: ../beak_image
  crypto: ^3.0.7
  meta: ^1.16.0
  shelf: ^1.4.2
  shelf_multipart: ^2.0.1
  shelf_router: ^1.1.4
  worm:
    path: ../worm
  worm_postgres:
    path: ../worm_postgres

dev_dependencies:
  # Dev-only: the MinIO integration suite exercises the `s3` plug-in driver.
  # Deliberately NOT a real dependency — see storage_wiring.dart.
  beak_storage_s3:
    path: ../beak_storage_s3
  image: ^4.9.1
  lints: ^6.0.0
  test: ^1.25.6

# Dev-only conflict, contained to this package: beak_storage_s3's minio 3.5.8
# pins xml ^6 while image 4.9.x (the test fixture generator) needs xml ^7.
# minio's xml use is xml-7-compatible, proven by the MinIO integration suite
# this override exists to run. Because both packages are dev_dependencies,
# consumers of beak_backend no longer inherit either constraint.
dependency_overrides:
  xml: ^7.0.1
