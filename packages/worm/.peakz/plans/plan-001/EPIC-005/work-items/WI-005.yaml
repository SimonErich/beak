{"workItemId":"WI-005","epicId":"EPIC-005","title":"Worm.unsafe() Zone-Based Escape Hatch for Strictness Bypass","status":"done","sequenceOrder":5,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-004 — adds the strictness enforcement in _guardFullTableScan that this WI bypasses","WI-006 — lazy loading prevention must also check Worm.isUnsafe for bypass"],"relatedEpics":[],"taskScope":"Implement a static Worm.unsafe<T>(Future<T> Function() callback) method on the existing Worm class in lib/src/registry/worm.dart. The method executes the callback inside a forked Dart Zone that carries a flag disabling all strictness enforcement. Any QueryBuilder terminal executed within the callback must skip DangerousQueryException and LazyLoadingException guards. The Zone key (_unsafeZoneKey) is defined as a const Symbol inline in worm.dart; both QueryBuilder and Model access the unsafe state via the public Worm.isUnsafe static getter (which reads Zone.current[_unsafeZoneKey]), avoiding any need for a shared key file and eliminating circular-import risk.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/registry/worm.dart","lib/src/query/query_builder.dart","test/src/registry/worm_unsafe_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["Pure Dart, no Flutter imports","Zone-based approach only — no static mutable state for the unsafe flag","Worm.unsafe() is public (exported via Worm class); the Zone key const is not exported from lib/worm.dart","The Zone check in _guardFullTableScan must be the FIRST check — before any flag checks — to ensure the bypass overrides all strictness"],"satisfiedByReference":[],"acceptanceCriteria":["User.query().get() (no WHERE, preventFullTableScans=true) throws DangerousQueryException outside Worm.unsafe()","Worm.unsafe(() async { return User.query().get(); }) returns List<User> without throwing when preventFullTableScans=true","After Worm.unsafe() callback completes, User.query().get() (no WHERE) still throws DangerousQueryException — Zone is restored","Worm.unsafe() propagates the callback return value correctly (e.g., returns List<User>)","Nested Worm.unsafe() calls work safely — Zone nesting does not error","wormUnsafeZoneKey is NOT exported from lib/worm.dart (it is package-internal)","dart analyze and dart format . produce no errors"],"errorFallbackCriteria":[],"uxCriteria":[],"testExpectations":[],"documentationExpectations":[],"nonGoalProtections":[],"testPlan":[],"keyScenarios":[],"mockingLimits":[],"verificationCommands":[],"validationMethod":"","valueUnlocked":"","dependentWork":[],"implementerNotes":"Do NOT create a separate lib/src/registry/unsafe_zone_key.dart file — it does not exist in the worktree and is not needed. The Zone key is defined inline in worm.dart at line 19 as 'const Symbol _unsafeZoneKey = #worm.unsafe'. Both query_builder.dart and model.dart access the unsafe state via the public Worm.isUnsafe static getter (which reads Zone.current[_unsafeZoneKey]) rather than importing a shared key file. This satisfies the no-static-mutable-state constraint while avoiding a circular-import-prone extra file. The relatedWorkItems note about model.dart importing unsafe_zone_key.dart is obsolete; model.dart imports from registry/ via Worm.isUnsafe instead.","touchExpansionJustification":"","requirementFindings":[],"codeReviewFindings":[],"testQualityFindings":[],"qaFindings":[],"finalSummary":""}