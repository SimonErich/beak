{"workItemId":"WI-006","epicId":"EPIC-005","title":"Lazy Loading Prevention in Strict Mode with LazyLoadingException","status":"partial","sequenceOrder":6,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-005 — provides Worm.unsafe() and the Worm.isUnsafe getter that this WI checks for bypass","WI-004 — similar strictness enforcement pattern (guard method + Zone bypass)"],"relatedEpics":[],"taskScope":"Add a guardRelationAccess(String relationName) helper to the Model base class that throws LazyLoadingException (from EPIC-006) when StrictnessConfig.preventLazyLoading is true and the named relation is not loaded in Model.relations. The guard must also bypass when Worm.unsafe() Zone is active (checked via Worm.isUnsafe). The guard is implemented directly in Model.getRelation<T>(String name) in lib/src/model/model.dart — no code generator changes are needed, because generated relation getters already call getRelation() and the base-class dispatch is sufficient. Non-strict mode keeps existing behavior (throw RelationNotLoadedException if not loaded).","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/model/model.dart","test/src/model/lazy_loading_strict_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["Pure Dart, no Flutter imports","guardRelationAccess must check Zone before throwing LazyLoadingException — WI-005's Worm.unsafe() must bypass this check","Non-strict mode must preserve existing RelationNotLoadedException behavior — do not silently swallow the not-loaded state","Do not introduce circular imports: model.dart can import from registry/ but registry/ should not import from model/"],"satisfiedByReference":[],"acceptanceCriteria":["Accessing user.posts on a non-eager-loaded User throws LazyLoadingException when Worm.config.strictness.preventLazyLoading=true","LazyLoadingException.modelName equals the model class name