{"workItemId":"WI-002","epicId":"EPIC-001","title":"Wire Validator Auto-Fire into ActiveRecord.save()","status":"done","sequenceOrder":2,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-001 — must be complete first; provides the updated Validator and Model.rules getter","WI-004 — Model.update() delegates to save(), so validation auto-fires via this WI"],"relatedEpics":[],"taskScope":"Inject automatic `Validator` invocation into `ActiveRecord.save()` between the `beforeValidate` and `afterValidate` hook dispatches. If `model.rules` is non-empty, build a `Validator` from those rules and call `validateOrThrow(model.state.attributes)`. A `ValidationException` propagates out of `save()` — it does NOT call `afterValidate` or any further hooks. If `model.rules` is empty (the default), skip validation silently. Use `model.updateRules` instead of `model.rules` when the model already exists (is being updated). Write a hook-order test proving the sequence.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/model/active_record.dart","lib/src/model/active_record_internals.dart","test/src/model/epic_001_lifecycle_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["Pure Dart, no Flutter imports","No dynamic or as casts","Validator is stateless — construct new instance per save() call","Depends on WI-001 being merged first (Validator uses Field keys)"],"satisfiedByReference":[],"acceptanceCriteria":["save() on a model with a failing rule throws ValidationException without calling afterValidate","save() on a model with a passing rule calls hooks in order: beforeValidate → validate → afterValidate → beforeSave → ...","save() on a model with empty rules (the default) completes without validation and fires all hooks normally","model.updateRules is used instead of model.rules when model.exists is true","Validator receives model.state.attributes as the values map","dart test passes"],"errorFallbackCriteria":[],"uxCriteria":[],"testExpectations":[],"documentationExpectations":[],"nonGoalProtections":[],"testPlan":[],"keyScenarios":[],"mockingLimits":[],"verificationCommands":[],"validationMethod":"","valueUnlocked":"","dependentWork":[],"implementerNotes":"IMPLEMENTED. Validation auto-fire lives in activeRecordValidate() in lib/src/model/active_record_internals.dart — not directly in active_record.dart. ActiveRecord.save() calls this helper between beforeValidate and afterValidate dispatcher calls. A new Validator instance is constructed per save() call. updateRules is used when model.exists is true. ValidationException propagates out without calling afterValidate. Tests covering AC-5 live in test/src/model/epic_001_lifecycle_test.dart (the lifecycle test consolidated all EPIC-001 model tests; the originally planned lifecycle_order_test.dart and _fixtures.dart were not created as separate files). dart_test.yaml covers test/src/model/ as a directory glob so the test is auto-discovered.","touchExpansionJustification":"","requirementFindings":[],"codeReviewFindings":[],"testQualityFindings":[],"qaFindings":[],"finalSummary":""}