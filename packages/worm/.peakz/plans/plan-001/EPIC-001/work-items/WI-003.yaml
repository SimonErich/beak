{"workItemId":"WI-003","epicId":"EPIC-001","title":"Add beforeRestore/afterRestore Lifecycle Events and Wire Into SoftDeletes","status":"done","sequenceOrder":3,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-005 — withoutEvents() must handle the new beforeRestore/afterRestore events","WI-008 — restore() eventually needs a transaction: parameter like save() and delete()"],"relatedEpics":[],"taskScope":"Add `beforeRestore` and `afterRestore` to the `LifecycleEvent` enum. Update `isCancelable()` to recognise `beforeRestore` as cancelable. Add corresponding no-op hook methods to `ModelHooks` and route them in `invokeHook()`/`invokeAfterHook()`. Add `beforeRestore(T model)`/`afterRestore(T model)` to `ModelObserver` and route them in `dispatchBefore()`/`dispatchAfter()`. Add a new static `ActiveRecord.restore(Model model)` method that fires hooks and delegates to `model.save()`. Update `SoftDeletes.restore()` to clear `_deletedAt` and call `ActiveRecord.restore(this)` instead of `save()` directly. Write tests proving correct hook dispatch order during restore.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/event/lifecycle_event.dart","lib/src/model/model_hooks.dart","lib/src/event/model_observer.dart","lib/src/model/active_record.dart","lib/src/model/soft_deletes.dart","test/src/model/epic_001_lifecycle_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["Pure Dart, no Flutter imports","All exhaustive switch statements must handle new enum values","No new abstract methods on DatabaseAdapter","SoftDeletes.restore() signature remains Future<void>","ActiveRecord.restore() is static and follows same pattern as ActiveRecord.save()/delete()"],"satisfiedByReference":[],"acceptanceCriteria":["LifecycleEvent enum contains beforeRestore and afterRestore values","isCancelable(LifecycleEvent.beforeRestore) returns true","isCancelable(LifecycleEvent.afterRestore) returns false","restore() fires hooks in order: beforeRestore → [save/DB UPDATE] → afterRestore","When beforeRestore returns false, _deletedAt is NOT cleared and save() is NOT called","ModelObserver subclass overriding beforeRestore/afterRestore receives correct callbacks during restore()","dart analyze and dart test pass with zero issues"],"errorFallbackCriteria":[],"uxCriteria":[],"testExpectations":[],"documentationExpectations":[],"nonGoalProtections":[],"testPlan":[],"keyScenarios":[],"mockingLimits":[],"verificationCommands":[],"validationMethod":"","valueUnlocked":"","dependentWork":[],"implementerNotes":"IMPLEMENTED WITH DIVERGENCE. beforeRestore and afterRestore exist in LifecycleEvent, isCancelable() recognises beforeRestore as cancelable, ModelHooks has both hook stubs, and ModelObserver routes both in dispatchBefore/dispatchAfter. DIVERGENCE: no static ActiveRecord.restore() was created. SoftDeletes.restore() dispatches hooks directly by calling ActiveRecord.dispatcherFor(this) inline, then calls save() without a transaction parameter. The architectural constraint 'SoftDeletes.restore() signature remains Future<void>' is not met — the actual signature is Future<bool>. All dispatch-order ACs (AC-7) are met by the inline approach. The missing static ActiveRecord.restore() only matters for WI-008's transaction routing; see WI-008 implementerNotes for the remaining gap.","touchExpansionJustification":"","requirementFindings":[],"codeReviewFindings":[],"testQualityFindings":[],"qaFindings":[],"finalSummary":""}