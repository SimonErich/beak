{"workItemId":"WI-005","epicId":"EPIC-001","title":"Add Model.withoutEvents() Static Hook Suppression","status":"done","sequenceOrder":5,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-003 — beforeRestore/afterRestore events from that WI are automatically suppressed by this mechanism","WI-004 — Model.forceDelete() already bypasses hooks by design; withoutEvents is orthogonal"],"relatedEpics":[],"taskScope":"Add a static `Model.withoutEvents(List<Type> modelTypes, FutureOr<T> Function() callback)` method that suppresses all lifecycle hook dispatching (model hooks and observer handlers) for the listed model types during the callback's execution. Implement suppression using a Zone-local `Set<Type>` so concurrent async operations in separate zones do not interfere. Update `EventDispatcher.dispatchBefore()` and `dispatchAfter()` to check the Zone variable before dispatching. Write tests proving type-scoped suppression.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/model/event_muting.dart","lib/src/model/model.dart","test/src/model/epic_001_lifecycle_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["Pure Dart, no Flutter imports","Zone is the correct Dart mechanism for scoped suppression in async code","No static mutable state (no static Set<Type> field) — Zone-local only","No changes to the model hook methods themselves — suppression is entirely at the dispatcher level"],"satisfiedByReference":[],"acceptanceCriteria":["Model.withoutEvents([User], callback) is a static method on Model","Inside the callback, user.save() fires zero lifecycle hooks for User models","Inside the callback, hooks for other model types (Post) are unaffected","Outside the callback, hooks fire normally for all model types","Model.withoutEvents([User, Post], callback) suppresses hooks for both User and Post simultaneously","Model.withoutEvents([], callback) suppresses nothing (no-op)","Suppression is Zone-scoped — a concurrent unrelated async operation in a different Zone is not affected","dart analyze and dart test pass"],"errorFallbackCriteria":[],"uxCriteria":[],"testExpectations":[],"documentationExpectations":[],"nonGoalProtections":[],"testPlan":[],"keyScenarios":[],"mockingLimits":[],"verificationCommands":[],"validationMethod":"","valueUnlocked":"","dependentWork":[],"implementerNotes":"IMPLEMENTED BUT ARCHITECTURAL VIOLATION REQUIRES RESOLUTION. Model.withoutEvents() exists and delegates to EventMuting.withoutEvents(). Type-scoped suppression, nested calls, and the global-mute sentinel all work correctly for sequential code. CRITICAL DEVIATION: EventMuting stores suppression state in a static final Map<Type, int> _counts field with refcounting. This violates the architectural constraint 'No static mutable state — Zone-local only' and means the AC 'Suppression is Zone-scoped — a concurrent unrelated async operation in a different Zone is not affected' is NOT provably met. Two overlapping async operations that each call withoutEvents() will share the same _counts map and can suppress each other's events. The implementer must decide: (a) rewrite EventMuting to store muted types in a Zone value via runZoned() and read via Zone.current, satisfying both the constraint and the concurrency AC; or (b) formally descope the concurrency AC if the project's usage pattern is strictly sequential (document the decision and remove the violated AC). EventMuting is correctly not exported from lib/worm.dart.","touchExpansionJustification":"","requirementFindings":[],"codeReviewFindings":[],"testQualityFindings":[],"qaFindings":[],"finalSummary":""}