{"workItemId":"WI-004","epicId":"EPIC-001","title":"Add Model.update(), Model.forceDelete(), and Model.replicate()","status":"done","sequenceOrder":4,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-001 — Model.update() calls save() which calls validation auto-fire from WI-002","WI-002 — validation fires inside save() which update() delegates to","WI-008 — future: forceDelete() and update() may need transaction: parameter"],"relatedEpics":[],"taskScope":"Add three new instance methods to the `Model` base class: (1) `update(Map<String, Object?> data)` — mass-assign data and call save(); (2) `forceDelete()` — unconditional hard delete via the database adapter, bypassing all hooks and SoftDeletes; (3) `newInstance()` — abstract method subclasses implement to return a blank same-type instance, used by `replicate()`; and `replicate({List<Field<Object?>> except = const []})` — returns an unsaved deep copy of this model. Add `ActiveRecord.forceDelete(Model model)` static method. Update tests.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/model/model.dart","lib/src/model/active_record.dart","lib/src/model/active_record_internals.dart","test/src/model/epic_001_lifecycle_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["Pure Dart, no Flutter imports","No dynamic or as casts","forceDelete() must NOT fire lifecycle hooks — no EventDispatcher calls","replicate() must use hydrateAttribute() not setAttribute() so copy starts clean (no dirty fields)","No changes to SoftDeletes.forceDelete() — it already works correctly"],"satisfiedByReference":[],"acceptanceCriteria":["model.update({'name': 'Alice'}) fills name, calls save(), returns Future<bool>, fires save lifecycle hooks in correct order","Model.forceDelete() exists on every Model regardless of SoftDeletes mixin presence","forceDelete() calls DeleteDescriptor against the model'