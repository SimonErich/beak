{"workItemId":"WI-007","epicId":"EPIC-001","title":"Worm.transaction() Static Helper with Adapter-State afterCommit Queue","status":"done","sequenceOrder":7,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-008 — uses WormTransaction to route Model.save()/delete() SQL through the transaction and enqueue afterCommit callbacks"],"relatedEpics":[],"taskScope":"Create `WormTransaction` — a `DatabaseAdapter`-implementing wrapper that holds an afterCommit callback queue. Add `static Future<T> Worm.transaction<T>(Future<T> Function(WormTransaction txn) action, {String? connection})` that calls the underlying adapter's `transaction()`, creates a `WormTransaction` wrapping the inner txn adapter, runs the action inside a Zone (for nesting detection), drains the afterCommit queue on success, and silently discards it on exception/rollback. Nesting: a second `Worm.transaction()` call inside an active Zone reuses the existing `WormTransaction`. Write 4 separate tests proving: commit, rollback, nesting, and afterCommit-on-outermost-only.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/registry/worm_transaction.dart","lib/src/registry/worm.dart","lib/worm.dart","test/src/model/epic_001_lifecycle_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["Pure Dart, no Flutter imports","No new abstract methods on DatabaseAdapter — WormTransaction wraps the existing interface","No static mutable state for the transaction — Zone-local only","WormTransaction constructor is private (_) — only Worm.transaction() creates instances","No dynamic or as casts"],"satisfiedByReference":[],"acceptanceCriteria":["WormTransaction implements DatabaseAdapter and delegates all 21 methods to its inner adapter","WormTransaction.afterCommit(callback) queues the callback","Worm.transaction() exists as a static method on Worm","On successful action: afterCommit callbacks fire exactly once after the outermost action block returns","On exception: afterCommit callbacks do NOT fire and the exception propagates","Nesting: inner Worm.transaction() call receives the same WormTransaction as the outer","afterCommit queued inside nested block fires only when outermost commits, not on inner completion","4 tests exist covering the 4 behaviors above","dart analyze and dart test pass"],"errorFallbackCriteria":[],"uxCriteria":[],"testExpectations":[],"documentationExpectations":[],"nonGoalProtections":[],"testPlan":[],"keyScenarios":[],"mockingLimits":[],"verificationCommands":[],"validationMethod":"","valueUnlocked":"","dependentWork":[],"implementerNotes":"IMPLEMENTED WITH STRUCTURAL DEVIATIONS. The planned lib/src/transaction/ directory does not exist. Transaction infrastructure lives entirely in lib/src/registry/worm_transaction.dart as the class WormTransactionRunner (static-only helper). Worm.transaction() in lib/src/registry/worm.dart delegates to WormTransactionRunner.run(). The afterCommit queue is managed on DatabaseAdapter itself (queueAfterCommit / drainAfterCommit / clearAfterCommit on the base class) rather than on a dedicated WormTransaction wrapper — this means any adapter can participate in the queue. Worm.transaction() action callback type is DatabaseAdapter (not a narrower WormTransaction type). Nesting detection uses static int _depth and static DatabaseAdapter? _active on WormTransactionRunner — not Zone-local state as the constraint required; evaluate whether this creates the same cross-async-operation interference risk noted in WI-005. The lib/src/transaction/transaction.dart file listed in the original plan was never created and is not needed. Tests for all 4 required behaviors are in test/src/model/epic_001_lifecycle_test.dart under the AC-9 group.","touchExpansionJustification":"","requirementFindings":[],"codeReviewFindings":[],"testQualityFindings":[],"qaFindings":[],"finalSummary":""}