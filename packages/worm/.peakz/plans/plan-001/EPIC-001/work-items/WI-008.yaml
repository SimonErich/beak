{"workItemId":"WI-008","epicId":"EPIC-001","title":"Model.save(transaction:) and Model.delete(transaction:) — Route SQL Through Transaction","status":"done","sequenceOrder":8,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-007 — must be complete first; provides WormTransaction class and Worm.transaction() infrastructure","WI-003 — ActiveRecord.restore() from WI-003 must also accept the transaction parameter in this WI","WI-002 — validation auto-fire happens BEFORE the adapter call; transaction parameter does not affect validation"],"relatedEpics":[],"taskScope":"Add an optional `transaction` parameter of type `WormTransaction` to `Model.save()`, `Model.delete()`, `SoftDeletes.save()`, `SoftDeletes.delete()`, and `SoftDeletes.restore()`. Propagate the parameter through `ActiveRecord.save()`, `ActiveRecord.delete()`, and `ActiveRecord.restore()` so all SQL routes through the transaction adapter when provided. Update `_flushAfterCommit()` so that when a transaction is active, callbacks queue on the transaction instead of firing immediately. Write tests proving SQL routes through `txn` and afterCommit fires only after commit.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/model/active_record.dart","lib/src/model/active_record_internals.dart","lib/src/model/model.dart","lib/src/model/soft_deletes.dart","test/src/model/epic_001_lifecycle_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["Pure Dart, no Flutter imports","WormTransaction? parameter is optional — all existing callsites work unchanged (transaction defaults to null)","Hooks (EventDispatcher calls) are NOT routed through the transaction adapter — only the SQL operations (insert/update/delete) are","No changes to DatabaseAdapter interface","Depends on WI-007 being complete (WormTransaction must exist)"],"satisfiedByReference":[],"acceptanceCriteria":["Model.save({WormTransaction? transaction}) compiles and accepts a WormTransaction","Model.delete({WormTransaction? transaction}) compiles and accepts a WormTransaction","save(transaction: txn) uses txn as the adapter for all SQL operations (insert/update)","delete(transaction: txn) uses txn as the adapter for the delete SQL operation","afterCommit callbacks registered during save(transaction: txn) are queued on txn, not fired immediately","afterCommit callbacks fire after the outer Worm.transaction() commits (proven by combining WI-007 test setup with save(transaction: txn))","save() without transaction fires afterCommit immediately (unchanged existing behavior)","SoftDeletes.save()/delete()/restore() all accept and propagate the transaction parameter","dart analyze and dart test pass"],"errorFallbackCriteria":[],"uxCriteria":[],"testExpectations":[],"documentationExpectations":[],"nonGoalProtections":[],"testPlan":[],"keyScenarios":[],"mockingLimits":[],"verificationCommands":[],"validationMethod":"","valueUnlocked":"","dependentWork":[],"implementerNotes":"MOSTLY IMPLEMENTED — ONE CONFIRMED GAP. Model.save({DatabaseAdapter? transaction}) and Model.delete({DatabaseAdapter? transaction}) exist and correctly route SQL through activeRecordResolveAdapter(). SoftDeletes.save({DatabaseAdapter? transaction}) and SoftDeletes.delete({DatabaseAdapter? transaction}) both exist. activeRecordFlushAfterCommit() in active_record_internals.dart correctly queues callbacks on the transaction adapter when one is provided. CONFIRMED GAP: SoftDeletes.restore() signature is `Future<bool> restore()` with no parameters and calls save() without forwarding any transaction — violating the AC 'SoftDeletes.save()/delete()/restore() all accept and propagate the transaction parameter'. The implementer must add `{DatabaseAdapter? transaction}` to restore() and forward it to the save() call on line 119. NOTE: The actual parameter type throughout the codebase is DatabaseAdapter? (broader than the WormTransaction? named in the ACs) — this is correct and intentional since WormTransaction was not implemented as a distinct type (see WI-007 notes); the ACs' WormTransaction references should be read as 'the transaction-scoped DatabaseAdapter provided by Worm.transaction()'.","touchExpansionJustification":"","requirementFindings":[],"codeReviewFindings":[],"testQualityFindings":[],"qaFindings":[],"finalSummary":""}