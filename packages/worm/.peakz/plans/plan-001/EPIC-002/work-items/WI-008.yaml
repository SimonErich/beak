{"workItemId":"WI-008","epicId":"EPIC-002","title":"whereRaw Escape Hatch","status":"done","sequenceOrder":8,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-003 — ExistsNode and ColumnNode establish the sealed class extension and PredicateEvaluator update pattern that WI-008 follows; RawNode was co-implemented in WI-003","WI-004 — where(Object, ...) overload accepts any PredicateTree; RawNode passes through where() transparently","WI-007 — adapter context gates (.sql()/.mongo()) are a DIFFERENT mechanism from whereRaw; both co-exist"],"relatedEpics":[],"taskScope":"Add a RawNode variant to the PredicateTree sealed class and a whereRaw(String sql, List<Object?> params, {bool allowRaw = false}) escape hatch method to QueryBuilder<T>. The method requires the explicit named parameter allowRaw: true to prevent accidental use — omitting it throws ConfigurationException. On InMemoryAdapter, RawNode evaluation throws UnsupportedOperationException (from EPIC-006) since InMemoryAdapter cannot interpret raw SQL. Update PredicateEvaluator to handle RawNode exhaustively with a clear error. Export RawNode via the query barrel if it is part of the public API.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/query/predicate_tree.dart","lib/src/query/query_builder.dart","lib/src/adapter/predicate_evaluator.dart","test/src/query/where_overloads_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["RawNode must be in predicate_tree.dart (sealed class constraint)","No 'as' casts","allowRaw must be a NAMED parameter with default false — positional optional bool would be too easy to accidentally satisfy","Params must NOT appear in toMap() serialization for security reasons","This is an escape hatch: document that it bypasses all ORM safety guarantees and should be used only when no typed alternative exists"],"satisfiedByReference":[],"acceptanceCriteria":["whereRaw('sql', params) without allowRaw: true throws ConfigurationException","whereRaw('sql', params, allowRaw: true) returns a QueryBuilder<T> with descriptor.where containing a RawNode","RawNode.sql equals the passed SQL string","RawNode.toMap() contains {type: raw, sql: ..., paramCount: N} and does NOT include the raw params list","Calling get() on a whereRaw query against InMemoryAdapter throws UnsupportedOperationException","PredicateEvaluator.matches() handles RawNode exhaustively (dart analyze: no non-exhaustive switch error)","whereRaw is chainable: whereRaw(sql, params, allowRaw: true).limit(10).where(nameField.eq('x')) compiles and produces a valid QueryBuilder"],"errorFallbackCriteria":[],"uxCriteria":[],"testExpectations":[],"documentationExpectations":[],"nonGoalProtections":[],"testPlan":[],"keyScenarios":[],"mockingLimits":[],"verificationCommands":[],"validationMethod":"","valueUnlocked":"","dependentWork":[],"implementerNotes":"RawNode was co-implemented during WI-003 since the PredicateTree sealed class required all variants to be added simultaneously. The whereRaw() method signature diverges from the original spec in two ways: (1) the parameters argument is a named optional parameter (not a positional List), matching the signature whereRaw(String sql, {List<Object?> parameters = const [], required bool allowRaw}) — this is strictly safer than the spec since allowRaw cannot be accidentally omitted. (2) allowRaw is required: true (not optional with default false) — passing allowRaw: false throws ConfigurationException at runtime. Test coverage was merged into where_overloads_test.dart rather than a separate query_builder_raw_test.dart file. SqlQueryContext.whereRaw() (used inside the .sql() gate from WI-007) omits the allowRaw requirement entirely since the gate already enforces adapter affinity. RawNode.toMap() returns {type: raw, sql: ..., paramCount: N} (not parameters list) matching the security constraint.","touchExpansionJustification":"","requirementFindings":[],"codeReviewFindings":[],"testQualityFindings":[],"qaFindings":[],"finalSummary":""}