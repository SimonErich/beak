{"workItemId":"WI-007","epicId":"EPIC-002","title":"Adapter Context Gates: .sql() and .mongo() with AdapterMismatchException","status":"done","sequenceOrder":7,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-005 — toSql()/toMongoFilter() inspection methods are DIFFERENT from .sql()/.mongo() gates; inspection is always callable, gates enforce adapter affinity","WI-008 — whereRaw escape hatch is a separate mechanism; it uses adapter capabilities not AdapterType"],"relatedEpics":[],"taskScope":"Add an AdapterType enum to the adapter module and a adapterType getter to DatabaseAdapter. Override it in InMemoryAdapter to return AdapterType.inMemory. Add two new chainable methods to QueryBuilder<T>: sql(callback) and mongo(callback) — each gate checks the adapter type and throws AdapterMismatchException (already exists) if the adapter does not match the expected family, otherwise applies the callback to this builder. The exception message must include both the expected and actual adapter names (AC-8). These gates allow callers to write adapter-specific query fragments that fail fast against incompatible adapters rather than silently generating wrong queries.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/query/adapter_dialect.dart","lib/src/query/sql_query_context.dart","lib/src/query/mongo_query_context.dart","lib/src/adapter/database_adapter.dart","lib/src/query/query_builder.dart","test/src/query/adapter_gates_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["AdapterType must be a separate file (not inlined into DatabaseAdapter) for clean imports","DatabaseAdapter getter must have a default implementation so existing third-party adapter implementations don't break","No 'as' casts","AdapterType.custom allows third-party adapters to compile without knowing about worm's specific adapter families","The sql() and mongo() methods return QueryBuilder<T> (not a specialised subtype) for EPIC-002; SQL-specific extensions are EPIC-005 territory"],"satisfiedByReference":[],"acceptanceCriteria":["AdapterType enum exists with values sql, mongodb, inMemory, custom","DatabaseAdapter.adapterType returns AdapterType.custom by default","InMemoryAdapter.adapterType returns AdapterType.inMemory","query.sql(callback) throws AdapterMismatchException when adapter is InMemoryAdapter (AC-8)","query.mongo(callback) throws AdapterMismatchException when adapter is InMemoryAdapter","The thrown AdapterMismatchException.expectedAdapter contains the SQL/Mongo adapter name","The thrown AdapterMismatchException.actualAdapter contains 'InMemoryAdapter'","AdapterMismatchException.toString() (or message) contains both adapter names (AC-8)","query.sql(callback) passes through and returns callback result when adapter has adapterType == AdapterType.sql","query.mongo(callback) passes through when adapter has adapterType == AdapterType.mongodb"],"errorFallbackCriteria":[],"uxCriteria":[],"testExpectations":[],"documentationExpectations":[],"nonGoalProtections":[],"testPlan":[],"keyScenarios":[],"mockingLimits":[],"verificationCommands":[],"validationMethod":"","valueUnlocked":"","dependentWork":[],"implementerNotes":"SIGNIFICANT ARCHITECTURE DIVERGENCE from original spec. The implementation uses runtime type name probing rather than an adapterType getter contract. Concrete divergences: (1) The enum is AdapterDialect (not AdapterType) and lives in lib/src/query/adapter_dialect.dart (not lib/src/adapter/adapter_type.dart). Values are sql/mongo/inMemory/other (not sql/mongodb/inMemory/custom as ACs specify). (2) Detection uses the free function detectAdapterDialect(DatabaseAdapter adapter) which probes adapter.runtimeType.toString() — no getter added to DatabaseAdapter or InMemoryAdapter. (3) .sql<R>(R Function(SqlQueryContext<T>) callback) and .mongo<R>(R Function(MongoQueryContext<T>) callback) both return R (the callback result) via generics, not QueryBuilder<T>. (4) The callbacks receive SqlQueryContext<T> and MongoQueryContext<T> respectively — these gated context objects expose adapter-specific surfaces (SqlQueryContext.whereRaw() without allowRaw requirement; MongoQueryContext.withRawFilter()/withPipeline()). This design achieves AC-8 (both adapter names in exception message) without modifying the DatabaseAdapter contract — third-party adapters need no changes. ACs specifying 'AdapterType enum', 'DatabaseAdapter.adapterType getter', and 'InMemoryAdapter.adapterType override' describe the original design and are not met literally by the runtime-probing approach; verify whether the ACs need updating to match the implemented design or vice versa. adapter_type.dart does not exist. lib/src/adapter/adapter.dart and lib/src/adapter/in_memory_adapter.dart required no changes.","touchExpansionJustification":"","requirementFindings":[],"codeReviewFindings":[],"testQualityFindings":[],"qaFindings":[],"finalSummary":""}