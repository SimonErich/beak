{"workItemId":"WI-003","epicId":"EPIC-002","title":"Boolean Composition: whereGroup, whereExists, whereColumn","status":"partial","sequenceOrder":3,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-001 — scalar aggregates do not touch PredicateTree; no conflict","WI-004 — where convenience overloads build on the existing where(PredicateTree) method added in this WI","WI-005 — toSql() and toMongoFilter() will include ExistsNode and ColumnNode in golden file output using the toMap() implementations defined here","WI-008 — RawNode was co-implemented here; WI-008 scope is now limited to whereRaw() method on QueryBuilder and its test coverage"],"relatedEpics":[],"taskScope":"Extend the PredicateTree sealed class with two new node types (ExistsNode and ColumnNode), and add three new chainable methods to QueryBuilder<T>: whereGroup (grouped sub-predicate), whereExists<S extends Model> (EXISTS subquery), and whereColumn (column-to-column comparison). Update PredicateEvaluator to handle the two new node types for InMemoryAdapter execution. GroupNode already exists in PredicateTree and is reused directly for whereGroup.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/query/predicate_tree.dart","lib/src/query/query_builder.dart","lib/src/adapter/predicate_evaluator.dart","lib/src/adapter/in_memory_store.dart","test/src/query/boolean_composition_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["ExistsNode and ColumnNode must be in predicate_tree.dart (sealed class constraint)","No 'as' casts — use Dart 3 patterns for ColumnNode's value comparison","No 'dynamic' in public API","whereGroup sub-builder must have allGlobalScopesDisabled: true so scope WHERE clauses don't leak into the group fragment","All new PredicateTree variants must implement toMap() for golden snapshot compatibility","RawNode was implemented in this same WI rath