{"workItemId":"WI-004","epicId":"EPIC-002","title":"where Convenience Overloads: 2-arg and 3-arg forms","status":"done","sequenceOrder":4,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-003 — whereGroup/whereExists/whereColumn also call the existing where(PredicateTree) internally; the Object-typed signature change must not break those callers","WI-005 — query inspection methods call _applyGlobalScopes() which internally uses where(); ensure no conflicts"],"relatedEpics":[],"taskScope":"Add two-argument and three-argument convenience overloads for the where method on QueryBuilder<T> so that `query.where(field, value)` and `query.where(field, operator, value)` compile and execute identically to `query.where(field.eq(value))` and `query.where(field.applyOp(operator, value))` respectively. Because Dart does not support method overloading, the implementation changes the existing `where(PredicateTree)` signature to accept a union of input types via Object-typed positional parameters with Dart 3 pattern matching for safe runtime dispatch.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/query/query_builder.dart","test/src/query/where_overloads_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["No 'as' casts — use Dart 3 switch patterns for type dispatch","The first case in the switch must be PredicateTree so existing callers are unaffected","The ArgumentError message must identify the received runtimeType to aid debugging","Immutability preserved — where() returns a new QueryBuilder via _copy()"],"satisfiedByReference":[],"acceptanceCriteria":["query.where(ageField, 18) compiles and returns the same rows as query.where(ageField.eq(18)) against InMemoryAdapter","query.where(ageField, Operator.gt, 18) compiles and returns the same rows as query.where(ageField.gt(18))","query.where(nameField, Operator.like, 'Al%') filters rows