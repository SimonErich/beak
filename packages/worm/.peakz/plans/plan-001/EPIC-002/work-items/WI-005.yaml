{"workItemId":"WI-005","epicId":"EPIC-002","title":"Query Inspection: toSql, toMongoFilter, explain, debug","status":"done","sequenceOrder":5,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-003 — ExistsNode and ColumnNode toMap() implementations are used in golden file output; WI-005 must run after WI-003","WI-007 — adapter gates (.sql()/.mongo()) are separate from toSql()/toMongoFilter() inspection methods; inspection is always callable, gates enforce adapter affinity","WI-006 — withoutGlobalScope<X> changes affect which scopes appear in the toSql() output"],"relatedEpics":[],"taskScope":"Add four query inspection methods to QueryBuilder<T>: toSql() returning String (adapter-compiled string representation), toMongoFilter() returning String (same via adapter), explain() returning Future<ExplainResult> (delegates to ExplainCapable adapter), and debug() returning QueryBuilder<T> (logs descriptor and returns self for chaining). These are inspection/debugging aids — none executes or modifies rows. Add golden file tests verifying toSql() and toMongoFilter() output against InMemoryAdapter for representative queries (AC-9). Enhance InMemoryAdapter.compileToString() to include WHERE predicate detail so golden output is meaningful.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/query/query_builder.dart","lib/src/query/sql_compiler.dart","lib/src/query/mongo_filter_compiler.dart","lib/src/adapter/in_memory_adapter.dart","test/src/query/query_inspection_test.dart","test/goldens/inspection/"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["No 'as' casts — use Dart 3 pattern matching for ExplainCapable check","debug() must not change QueryBuilder state — it is a pure observer","toSql()/toMongoFilter() must call _applyGlobalScopes() — scoped WHERE must appear in output","dart:developer for logging, not print/stderr"],"satisfiedByReference":[],"acceptanceCriteria":["toSql() returns a non-empty string from context.adapter.compileToString() with global scopes applied","toMongoFilter() returns a non-empty string from compileToString() with global scopes applied","toSql() output for a query with where(name.eq('Alice')).limit(10) matches the golden file test/src/query/golden/simple_query.txt","explain() returns ExplainResult with usesIndex == true for InMemoryAdapter (synthetic always-indexed plan)","explain() throws UnsupportedOperationException when the adapter does not mix in ExplainCapable","debug() returns the identical QueryBuilder<T> (same descriptor) and does not mutate builder state","debug() does not throw; it always succeeds even on complex predicates","InMemoryAdapter.compileToString() includes WHERE predicate info in its output for QueryDescriptor inputs"],"errorFallbackCriteria":[],"uxCriteria":[],"testExpectations":[],"documentationExpectations":[],"nonGoalProtections":[],"testPlan":[],"keyScenarios":[],"mockingLimits":[],"verificationCommands":[],"validationMethod":"","valueUnlocked":"","dependentWork":[],"implementerNotes":"SqlCompiler and MongoFilterCompiler are const-constructible classes located in lib/src/query/ (not lib/src/adapter/ as one might expect). Both are pure compilers — they render literal values inline (no bind placeholders) to produce deterministic golden-comparable strings. Golden files live at test/goldens/inspection/ (not test/src/query/golden/ as originally planned) and use the .golden extension (not .txt); 11 golden files were created covering toSql_{plain,where_eq,complex,group,exists,column,raw}.golden and toMongo_{plain,where_eq,exists,group}.golden. UPDATE_GOLDENS=true environment variable triggers golden update mode in the test. The test file was named query_inspection_test.dart. IMPORTANT: debug() was implemented with return type String (a formatted debug summary string) rather than QueryBuilder<T> as AC-6 specifies — verify whether this divergence needs correction before marking WI-005 complete. InMemoryAdapter.compileToString() now delegates to SqlCompiler for golden-quality output.","touchExpansionJustification":"","requirementFindings":[],"codeReviewFindings":[],"testQualityFindings":[],"qaFindings":[],"finalSummary":""}