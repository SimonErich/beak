{"workItemId":"WI-001","epicId":"EPIC-002","title":"Scalar Aggregate Terminals: sum, avg, min, max","status":"done","sequenceOrder":1,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-002 — streaming terminals follow same pattern of delegating to adapter without row materialisation","WI-005 — query inspection (toSql) will cover aggregate descriptors in golden file tests"],"relatedEpics":[],"taskScope":"Add four scalar aggregate terminal methods to QueryBuilder<T>: sum(Field<num>), avg(Field<num>), min<V>(Field<V>), and max<V>(Field<V>). Each method must build an AggregateDescriptor and delegate directly to the matching DatabaseAdapter method — never calling select() or iterating any rows. The InMemoryAdapter already fully implements sum/avg/min/max on AggregateDescriptor. Global scopes must be applied and the accumulated WHERE clause must be included before dispatching to the adapter.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/query/query_builder.dart","lib/src/query/aggregate_descriptor.dart","test/src/query/aggregate_terminals_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["Pure Dart, no Flutter imports","No 'as' casts — use Dart 3 switch patterns or 'is' checks for type narrowing","No dynamic typing in the public API","No rows may be materialised; only AggregateDescriptor dispatched to adapter","Immutability: new methods must be terminals (return Future, not QueryBuilder<T>)"],"satisfiedByReference":[],"acceptanceCriteria":["sum(field) calls adapter.sum() with AggregateDescriptor carrying the correct table name, column name matching field.name, and any accumulated WHERE predicate","sum(field) never calls adapter.select() (verified via TrackingAdapter.calls list)","avg(field) returns double? matching the arithmetic mean of matching rows in InMemoryAdapter","min<int>(intField) returns the smallest int value among matching rows","max<String>(stringField) returns the lexicographically largest string value among matching rows","null is returned from min/max when no rows match the WHERE clause","A WHERE clause added via .where(predicate) before calling sum/avg/min/max is included in the AggregateDescriptor.where field passed to the adapter","All four methods work correctly when no WHERE clause is accumulated (full-table aggregate)"],"errorFallbackCriteria":[],"uxCriteria":[],"testExpectations":[],"documentationExpectations":[],"nonGoalProtections":[],"testPlan":[],"keyScenarios":[],"mockingLimits":[],"verificationCommands":[],"validationMethod":"","valueUnlocked":"","dependentWork":[],"implementerNotes":"AggregateDescriptor and AggregateFunction enum already existed before EPIC-002 (from EPIC-000 foundation work) in lib/src/query/aggregate_descriptor.dart. sum(), avg(), min(), max() are fully implemented in QueryBuilder as terminals delegating to context.adapter. The test file was named aggregate_terminals_test.dart (not query_builder_aggregates_test.dart as originally planned). A _RecordingAdapter fixture in the test file verifies that adapter.select() is never called during aggregate operations — this is the canonical verification pattern for AC-1. AggregateDescriptor also has a count() convenience constructor used by the count() terminal.","touchExpansionJustification":"","requirementFindings":[],"codeReviewFindings":[],"testQualityFindings":[],"qaFindings":[],"finalSummary":""}