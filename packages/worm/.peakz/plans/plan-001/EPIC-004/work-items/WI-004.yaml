{"workItemId":"WI-004","epicId":"EPIC-004","title":"Test Transaction Helpers: Worm.beginTestTransaction and rollbackTestTransaction","status":"done","sequenceOrder":4,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-001 — Factory.create() calls Model.save() which calls Worm.adapter(); with this WI active, factory creates go through the test transaction automatically"],"relatedEpics":[],"taskScope":"Add `Worm.beginTestTransaction()` and `Worm.rollbackTestTransaction()` static methods to the Worm registry. These provide test isolation by starting a transaction on the default adapter, exposing the transactional adapter for all subsequent Worm.adapter() calls during the test, and rolling back all changes when rollback is called. The implementation uses a Completer-based suspension pattern to keep the callback-based transaction open until explicitly rolled back.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/registry/worm.dart","test/src/registry/worm_test_transaction_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["No ! operator on _testTxnAdapter unless null is proven; use `final testTxn = _testTxnAdapter; if (testTxn != null) return testTxn;` pattern for type promotion","No new abstract methods added to DatabaseAdapter — the Completer suspension must work with the existing callback-based API","These methods are for test use only — add a doc comment warning: not safe for concurrent production use","Completer<Never> signals that the completer will never complete normally (always an error = rollback)"],"satisfiedByReference":[],"acceptanceCriteria":["After beginTestTransaction() + insert + rollbackTestTransaction(), the adapter row count equals the pre-test count (insert is undone)","Worm.adapter() during an active test transaction returns the transactional adapter (verified by referential equality or by checking that a query on it reflects the in-transaction state)","Calling beginTestTransaction() twice without rollback throws ConfigurationException with key 'test_transaction.duplicate'","rollbackTestTransaction() is a no-op (does not throw) when no test transaction is active","Worm.reset() clears any active test transaction without leaving dangling Completers"],"errorFallbackCriteria":[],"uxCriteria":[],"testExpectations":[],"documentationExpectations":[],"nonGoalProtections":[],"testPlan":[],"keyScenarios":[],"mockingLimits":[],"verificationCommands":[],"validationMethod":"","valueUnlocked":"","dependentWork":[],"implementerNotes":"NEITHER METHOD EXISTS — confirmed by reading worm.dart lines 85-209. worm.dart currently has: `initialize()`, `reset()`, `isInitialized`, `config`, `models`, `observers`, `adapter()`, `registrationOf<T>()`, `registrationForType()`, `registeredConnections`, `observersFor()`, `environment` — no transaction helpers. `reset()` (lines 85-94) only disconnects adapters and clears state maps — it does not handle any transaction cleanup. This WI requires full implementation from scratch. Read the `DatabaseAdapter` transaction API (the callback-based `transaction(Future<T> Function(DatabaseAdapter) callback)` method) before implementing — the Completer suspension pattern works by starting a transaction and never completing the callback until `rollbackTestTransaction()` signals the Completer. The `adapter()` method must be updated to return the stored transactional adapter when one is active, falling back to the normal adapter resolution otherwise.","touchExpansionJustification":"","requirementFindings":[],"codeReviewFindings":[],"testQualityFindings":[],"qaFindings":[],"finalSummary":""}