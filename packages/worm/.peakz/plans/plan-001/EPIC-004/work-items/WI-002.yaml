{"workItemId":"WI-002","epicId":"EPIC-004","title":"Factory Relation Helpers: has() and for_() on Factory and _FactoryPlan","status":"done","sequenceOrder":2,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-001 — defines Factory<T>, _FactoryPlan<T>, and the type bound change to Model; must complete before this WI"],"relatedEpics":[],"taskScope":"Add `has<R extends Model>(Factory<R> childFactory, RelationField<T, R> relation)` and `for_<P extends Model>(P parent, RelationField<T, P> relation)` methods to both `Factory<T>` and `_FactoryPlan<T>`. The `has()` method configures the factory to create related child records and link them via FK after the parent is persisted. The `for_()` method configures the factory so each produced instance has its FK column pre-filled to point at a given parent. Both methods return a `_FactoryPlan<T>` that includes relationship configuration executed in `create()`.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/factory/factory_base.dart","lib/src/relation/relation_field.dart","lib/src/relation/relation.dart","test/src/factory/factory_relations_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["No as casts — use pattern matching or typed APIs for accessing typed values from Object","No dynamic — type-erased storage must use Object bounds, not dynamic","RelationField<T, R> must be a real typed class — no Map<String, String> for relation metadata","If RelationField already exists from EPIC-000, use that type; do not create a duplicate","Children are created sequentially (await each); Future.wait optimization is EPIC-007 scope"],"satisfiedByReference":[],"acceptanceCriteria":["UserFactory().has(PostFactory().count(3), User$.posts).create() persists 1 user and 3 posts where each post's FK column (relation.foreignKey) equals user.id","PostFactory().for_(user, User$.posts).count(3).create() persists 3 posts each with the FK column set to user.id","UserFactory().count(2).has(PostFactory().count(3), User$.posts).create() persists 2 users and 6 posts (3 per user, each set with correct FK for their parent)","has() can be called multiple times on the same factory chain; each call registers an independent has-relationship","RelationField<T, R> exposes String get foreignKey and String get localKey; dart analyze is clean"],"errorFallbackCriteria":[],"uxCriteria":[],"testExpectations":[],"documentationExpectations":[],"nonGoalProtections":[],"testPlan":[],"keyScenarios":[],"mockingLimits":[],"verificationCommands":[],"validationMethod":"","valueUnlocked":"","dependentWork":[],"implementerNotes":"has() AND for_() DO NOT EXIST on Factory<T> — confirmed by direct file inspection. RelationField<T> EXISTS in lib/src/relation/relation_field.dart but currently has only a single type parameter and only a `name: String` field — it has NO `foreignKey` or `localKey` getters. AC-5 requires RelationField<T, R> (two type params) with `String get foreignKey` and `String get localKey`. The implementer must: (1) add second type parameter R to RelationField (0.x breaking change acceptable); (2) add `foreignKey` and `localKey` getters — determine their values from codegen conventions (likely `${R.tableName}_id` for FK and `id` for localKey, or stored as constructor params from codegen); (3) update codegen companion classes that emit `User$.posts`-style constants to produce `RelationField<User, Post>` typed instances with correct FK/localKey values; (4) implement `has()` and `for_()` on both Factory<T> and _FactoryPlan<T>. Read lib/src/relation/relation.dart before modifying RelationField to understand the full relation system — HasMany, BelongsTo, etc. likely reference RelationField and may need updates when the type parameter is added.","touchExpansionJustification":"","requirementFindings":[],"codeReviewFindings":[],"testQualityFindings":[],"qaFindings":[],"finalSummary":""}