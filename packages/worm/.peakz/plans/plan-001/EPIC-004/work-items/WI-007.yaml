{"workItemId":"WI-007","epicId":"EPIC-004","title":"CLI make:migration --auto, Migration dependsOn Ordering, and Cycle Detection","status":"done","sequenceOrder":7,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-005 — Schema facade must be complete before this WI generates migration files using upSchema style","WI-006 — composite FK DDL may appear in --auto generated migrations if the target schema includes FK definitions"],"relatedEpics":[],"taskScope":"Add a `--auto` flag to `worm make:migration` that introspects the current DB schema and compares it to a provided target schema using DiffEngine, then generates a migration file containing the detected changes. Add a `List<String> get dependsOn` getter to the Migration base class. Update MigrationRunner to topologically sort migrations by dependsOn before execution, detecting cycles and rejecting them with an error that names both migrations in the cycle. Note: schema:dump --prune is already implemented (the flag and force gate exist in schema_dump_command.dart) — this WI verifies and tests that existing implementation but does not re-implement it.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/migration/migration_base.dart","lib/src/migration/migration_runner.dart","lib/src/migration/migration_auto_generator.dart","lib/src/migration/migration_dependency_sorter.dart","lib/src/cli/commands/make_migration_command.dart","test/src/migration/migration_ordering_test.dart","test/src/cli/make_migration_auto_test.dart","test/src/cli/schema_dump_prune_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["No as casts — JSON parsing must use pattern matching on Map values","No dynamic — parsed JSON must be typed as Map<String, Object?> then pattern-matched to extract values","Topological sort is O(V+E) — do not use O(V²) approaches","CLI exit codes: UsageException → 2, uncaught exception → 1, success → 0 (per project convention)","The --auto migration file uses upSchema(Schema schema) style — depends on WI-005 Schema facade being complete"],"satisfiedByReference":[],"acceptanceCriteria":["worm make:migration --auto reads schema/schema.json, diffs against the live DB schema, and writes a migration file containing Blueprint calls matching the detected diff","Running the generated --auto migration against the adapter produces a schema that matches the target (verified by re-running DiffEngine.diff() and asserting isEmpty == true)","A migration with dependsOn: ['earlier_migration'] runs after 'earlier_migration' regardless of registration order in the migrations list","A cycle (migration A depends on B, B depends on A) causes MigrationRunner.migrate() to throw MigrationException with both migration names 'A' and 'B' present in the error message","schema:dump --prune --force deletes all .dart files from the migrations/ directory and writes schema/schema_dump.dart","schema:dump --prune without --force returns exit code 1 with an error message containing '--force'","Migrations with empty dependsOn (the default) continue to run in registration order, unaffected by the topological sort"],"errorFallbackCriteria":[],"uxCriteria":[],"testExpectations":[],"documentationExpectations":[],"nonGoalProtections":[],"testPlan":[],"keyScenarios":[],"mockingLimits":[],"verificationCommands":[],"validationMethod":"","valueUnlocked":"","dependentWork":[],"implementerNotes":"MIXED STATE — some infrastructure exists, core features do not. WHAT EXISTS: `DiffEngine` in lib/src/migration/diff_engine.dart (static class with `diff({from, to})` comparing `List<TableSchema>`) is complete and ready to use. `schema_dump_command.dart` has both `--prune` and `--force` flags already — read the implementation to verify the file-deletion logic before writing tests for AC-5/AC-6. WHAT IS MISSING: `--auto` flag does not exist on `make_migration_command.dart` (only `--table` exists);