{"workItemId":"WI-003","epicId":"EPIC-004","title":"Seeder Tracking: SeederRecordStore, DatabaseSeeder, Seeder.order, and Idempotent Runner","status":"done","sequenceOrder":3,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-001 — factory create() is used inside user-authored seeders that call Factory.create(); WI-003 does not depend on WI-001 but benefits from it"],"relatedEpics":[],"taskScope":"Wire SeederRecord into idempotent tracking via a new SeederRecordStore; update SeederRunner to check-before-run and record-after-run against worm_seeders; add Seeder.order for explicit ordering; add DatabaseSeeder as a composable master seeder.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/seeder/seeder_record_store.dart","lib/src/seeder/database_seeder.dart","lib/src/seeder/seeder_base.dart","lib/src/seeder/seeder_runner.dart","lib/src/seeder/seeder.dart","test/src/seeder/seeder_record_store_test.dart","test/src/seeder/database_seeder_test.dart","test/src/seeder/seeder_runner_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["No dynamic, no as casts — SeederRecord.fromRow already uses pattern matching; keep that pattern in SeederRecordStore","SeederRecordStore must not call Worm.adapter() — it receives its adapter via constructor injection","DatabaseSeeder does NOT call store.record() — that is SeederRunner's responsibility","Seeder.order has no maximum; the sort is purely by integer comparison"],"satisfiedByReference":[],"acceptanceCriteria":["Running the same seeder twice with a SeederRecordStore inserts exactly 1 row in worm_seeders and the second invocation's run() method on the seeder is never called","SeederRunner.run() with store=null behaves identically to pre-WI behavior: all matching seeders run without idempotency check","SeederRunner sorts seeders by Seeder.order before execution; a seeder with order=2 runs after one with order=1 regardless of registration order","DatabaseSeeder.run() calls child seeders in the exact order declared in the seeders getter; verified by a fake that records invocation order in a List<String>","SeederRecordStore.hasRun('UserSeeder') returns false before running and true after running","SeederRecordStore.ensureTable() can be called multiple times without error (idempotent — uses ifNotExists)"],"errorFallbackCriteria":[],"uxCriteria":[],"testExpectations":[],"documentationExpectations":[],"nonGoalProtections":[],"testPlan":[],"keyScenarios":[],"mockingLimits":[],"verificationCommands":[],"validationMethod":"","valueUnlocked":"","dependentWork":[],"implementerNotes":"THREE ITEMS ARE MISSING, ONE EXISTS PARTIALLY. MISSING: (1) `Seeder.order` getter — seeder_base.dart has only `name`, `environment`, and `run()` — add `int get order => 0` default; (2) `SeederRecordStore` — seeder_record_store.dart does not exist — create it; (3) `DatabaseSeeder` — database_seeder.dart does not exist — create it. PARTIAL: `SeederRunner` in seeder_runner.dart currently has environment filtering and delegation but NO tracking persistence — update it to accept an optional SeederRecordStore and integrate check-before-run/record-after-run. EXISTING INFRASTRUCTURE: `SeederRecord` in seeder_record.dart has the correct model shape (`name`, `executedAt`, `tableName = 'worm_seeders'`, `fromRow()` with pattern matching, `toMap()`) — use it as the DTO for SeederRecordStore operations. `seeder_runner_test.dart` already EXISTS — read it before modifying SeederRunner to understand what behavior is already tested and avoid regressions. The barrel seeder.dart currently exports only `environment.dart`, `seeder_base.dart`, `seeder_record.dart`, `seeder_runner.dart` — add exports for `seeder_record_store.dart` and `database_seeder.dart`.","touchExpansionJustification":"","requirementFindings":[],"codeReviewFindings":[],"testQualityFindings":[],"qaFindings":[],"finalSummary":""}