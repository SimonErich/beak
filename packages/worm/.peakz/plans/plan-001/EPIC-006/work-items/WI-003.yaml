ueUnlocked":"","dependentWork":[],"implementerNotes":"As of 2026-05-24 UnsupportedOperationException is CORRECT: extends WormException, fields operation: String and adapter: String?, tested, exported. OperationCancelledException has a SIGNIFICANT DEVIATION that violates AC-3: it extends ModelException (not WormException directly) and has fields modelName: String, operation: String, reason: String? — there is no 'hook' field. The AC states 'Both are WormException instances but are NOT ModelException or AdapterException instances', which is currently violated. Implementer must choose one of two resolutions: (A) Reparent OperationCancelledException to extend WormException directly, remove 'modelName', add 'hook: String?' — this matches the original spec for a cross-cutting hook-cancellation signal; or (B) Accept the model-layer placement and update all AC text to reflect 'is a ModelException' and document why hook cancellation is model-scoped. Resolution (A) is the spec-compliant path. The current test in exception_test.dart places OperationCancelledException in the ModelException umbrella group (lines 17-102) — if resolved via (A), move that test to the WormException group.","touchExpansionJustification":"","requirementFindings":[],"codeReviewFindings":[],"testQualityFindings":[],"qaFindings":[],"finalSummary":""}