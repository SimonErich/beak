{"workItemId":"WI-002","epicId":"EPIC-000","title":"Add RelationField<T> Type to Core Field System","status":"done","sequenceOrder":2,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-001 — prerequisite; establishes clean state","WI-003 — uses RelationField<T> in generated companion output; must wait for this WI"],"relatedEpics":[],"taskScope":"EXISTING FILE REQUIRES DESIGN REFACTOR: packages/worm/lib/src/relation/relation_field.dart already exists in this worktree (untracked) but uses the wrong design. The pre-built implementation is RelationField<Parent extends Model, Child extends Model> with a named constructor (const RelationField({required this.name, required this.cardinality})) and a cardinality field — this does NOT satisfy the acceptance criteria, which require a single-type-parameter design RelationField<T> with a positional constructor (const RelationField(this.name)) where cardinality is encoded in the type argument (List<ChildType> for many, ChildType for one). Refactor the existing relation_field.dart to this single-param positional design. Remove RelationCardinality enum from relation_field.dart (cardinality is now implicit in T). Keep the file in src/relation/ — do NOT move to src/query/. Verify relation.dart barrel already exports it (it is modified in worktree). Write unit tests at packages/worm/test/src/relation/relation_field_test.dart.","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["packages/worm/lib/src/relation/relation_field.dart","packages/worm/lib/src/relation/relation.dart","packages/worm/test/src/relation/relation_field_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["Pure Dart — no imports needed in relation_field.dart (no Flutter, no meta, no other packages)","final class — no subclassing","const constructor — non-negotiable for companion static const usage","No as casts","No dynamic fields","File stays in src/relation/ not src/query/ — companion_generator.dart already imports from that location and must not be broken"],"satisfiedByReference":[],"acceptanceCriteria":["RelationField<List<dynamic>>('posts').name == 'posts' holds in test","const RelationField<Object>('user') compiles without error (const constructor works)","RelationField<dynamic>('x') is Field returns false in test (separate class hierarchy)","RelationField is importable as import 'package:worm/worm.dart' and usable as RelationField<dynamic>","dart analyze packages/worm/ exits with code 0","dart test packages/worm/ exits with code 0","query.dart barrel contains export 'relation_field.dart'"],"errorFallbackCriteria":[],"uxCriteria":[],"testExpectations":[],"documentationExpectations":[],"nonGoalProtections":[],"testPlan":[],"keyScenarios":[],"mockingLimits":[],"verificationCommands":[],"validationMethod":"","valueUnlocked":"","dependentWork":[],"implementerNotes":"CRITICAL DESIGN CONFLICT: The pre-built relation_field.dart uses RelationField<Parent extends Model, Child extends Model> (2 type params, named constructor, cardinality field). The acceptance criteria test RelationField<List<dynamic>>('posts') and RelationField<Object>('user') — both using a single type param and a positional string argument. The pre-built design cannot satisfy these ACs without refactoring. The correct design is: final class RelationField<T> { const RelationField(this.name); final String name; } with no cardinality field (cardinality is encoded in T: RelationField<List<Post>> for many, RelationField<Post> for one). The RelationCardinality enum defined in the existing relation_field.dart must move to RelationDescriptor in worm/lib/src/codegen/ or be deleted — companion_generator.dart uses RelationDescriptorKind (not RelationCardinality) to decide List<T> vs T wrapping, so RelationCardinality is not needed in the runtime type. The import 'package:worm/lib/src/model/model.dart' in the pre-built file must be removed (i