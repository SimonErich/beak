{"workItemId":"WI-001","epicId":"EPIC-007","title":"Add loadedColumns tracking to ModelState and make hydration partial-row-safe","status":"done","sequenceOrder":1,"storyCluster":"","epicGoal":"","whyThisExists":"","scopedContext":"","implementationSummary":"","thingsToConsider":[],"relatedWorkItems":["WI-002 — builds on loadedColumns to implement the strict-mode field access guard","WI-003 — concurrent eager loading uses the updated hydration path; needs to know Hydrator typedef signature","WI-009 — performance regression suite relies on correct partial-row hydration for stream memory tests"],"relatedEpics":[],"taskScope":"Extend ModelState with a Set<String> loadedColumns field. Modify the HydrationGenerator to (a) emit partial-row-safe fromRow() code that skips columns absent from the row map rather than throwing FormatException, and (b) populate state.loadedColumns with the keys that were actually present in the row. Update QueryContext's Hydrator typedef to accept an optional Set<String>? requestedColumns so callers can distinguish 'column was absent because select() restricted it' from 'column was absent for an unexpected reason'. Thread the QueryDescriptor.columns set from QueryBuilder.get() and QueryBuilder.first() through to the hydrator invocation so the loaded model reflects which columns were requested. Write unit tests covering full-row hydration (loadedColumns = all columns), partial-row hydration (loadedColumns = requested subset), and empty-select hydration (no restriction, loadedColumns = all present keys).","inScope":[],"outOfScope":[],"nonGoals":[],"expectedFiles":["lib/src/model/model_state.dart","lib/src/query/query_context.dart","lib/src/query/query_builder.dart","lib/src/codegen/hydration_generator.dart","test/src/model/model_state_test.dart","test/src/codegen/hydration_partial_row_test.dart"],"existingUtilities":[],"integrationNotes":"","architecturalConstraints":["No dynamic types anywhere in generated or hand-written code","No as casts — us