name: beak
description: >-
  Beak — a configuration-driven admin panel for Dart and Flutter. Declare your
  models once and get a typed REST API, a panel, migrations and seeds.
version: 0.0.1
publish_to: none
repository: https://github.com/SimonErich/beak/tree/main/packages/beak
homepage: https://github.com/SimonErich/beak
issue_tracker: https://github.com/SimonErich/beak/issues
topics: [admin-panel, flutter, low-code, crud]

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  beak_backend:
    path: ../beak_backend
  beak_core:
    path: ../beak_core
  beak_frontend:
    path: ../beak_frontend
  beak_test:
    path: ../beak_test
  flutter:
    sdk: flutter
  # Re-exported by `package:beak/ui.dart` so a project composing its own
  # screens needs no second dependency. Keep the ref identical everywhere;
  # test/obers_ui_pin_test.dart enforces it.
  obers_ui:
    git:
      url: https://github.com/SimonErich/obers_ui.git
      ref: 9fad953d77e90d2aaf2399a7b1b2085c5dd504ca
  obers_ui_autoforms:
    git:
      url: https://github.com/SimonErich/obers_ui.git
      path: packages/obers_ui_autoforms
      ref: 9fad953d77e90d2aaf2399a7b1b2085c5dd504ca
  obers_ui_charts:
    git:
      url: https://github.com/SimonErich/obers_ui.git
      path: packages/obers_ui_charts
      ref: 9fad953d77e90d2aaf2399a7b1b2085c5dd504ca
  worm:
    path: ../worm

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.6
