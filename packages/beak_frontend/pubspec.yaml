name: beak_frontend
description: >-
  Beak admin-panel Flutter widgets — panel shell, data table, forms, detail
  views, actions, and dashboards built on obers_ui.
version: 0.9.0
publish_to: none
repository: https://github.com/SimonErich/beak/tree/main/packages/beak_frontend
homepage: https://github.com/SimonErich/beak
issue_tracker: https://github.com/SimonErich/beak/issues
topics: [admin-panel, flutter, low-code, ui]

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  beak_core:
    path: ../beak_core
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  mime: ^2.0.0
  flutter_hooks: ^0.21.3
  get_it: ^9.2.1
  go_router: ^17.3.0
  http: ^1.6.0
  intl: ^0.20.2
  meta: ^1.16.0
  # Pinned by commit, not path: a path dep climbing above the repo root
  # ("../../../obers_ui") makes a fresh clone unresolvable and this package
  # unpublishable. To work against a local obers_ui checkout instead, run
  # `melos run link-obers-ui`.
  # Keep the ref identical everywhere; test/obers_ui_pin_test.dart enforces it.
  obers_ui:
    git:
      url: https://github.com/SimonErich/obers_ui
      ref: c956d25634c93e23847ec5a4150c1d62fe3a7c90
  obers_ui_autoforms:
    git:
      url: https://github.com/SimonErich/obers_ui
      path: packages/obers_ui_autoforms
      ref: c956d25634c93e23847ec5a4150c1d62fe3a7c90
  obers_ui_charts:
    git:
      url: https://github.com/SimonErich/obers_ui
      path: packages/obers_ui_charts
      ref: c956d25634c93e23847ec5a4150c1d62fe3a7c90
  signals: ^6.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  # The panel suites serve their widgets from the real in-memory source
  # rather than a fake that ignores the query spec.
  beak_test:
    path: ../beak_test
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
