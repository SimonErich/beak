name: worm_generator
description: >
  Build-runner code generation for the worm ORM. Emits
  *.worm.dart companion files for @Table-annotated models.
version: 0.1.0
publish_to: none

executables:
  worm_gen: worm_gen

environment:
  sdk: ^3.11.0

dependencies:
  analyzer: ^14.0.0
  build: ^5.0.0
  source_gen: ^4.3.1
  worm:
    path: ../worm

dev_dependencies:
  build_runner: ^2.17.1
  build_test: ^3.5.23
  lints: ^6.0.0
  test: ^1.25.6
