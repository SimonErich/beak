# Serves the built Flutter web panel and falls back to index.html so client-side
# (go_router) routes resolve on a hard refresh.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Long-cache the hashed build assets, never the entry document.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
