# Production-style stack for Beak: Postgres, the backend server, and the
# Flutter web panel. Uploads go to a named volume through the `local` storage
# driver: the shop registers no S3 driver, so `s3` would stop the server at
# boot. Run from the repo root:
#
#   # 1. Start the database
#   docker compose -f deploy/docker-compose.prod.yml up -d postgres
#   # 2. One-time setup: run migrations, seed demo data
#   docker compose -f deploy/docker-compose.prod.yml --profile setup run --rm migrate
#   docker compose -f deploy/docker-compose.prod.yml --profile setup run --rm migrate db:seed
#   # 3. Build and start the app
#   docker compose -f deploy/docker-compose.prod.yml up -d --build server web
#
# The panel (host :8090) calls the API at http://localhost:8080 (the panel's
# built-in apiBaseUrl), which is where the server is published below. Both
# ports are published on the loopback interface only: the shop's server has no
# policy and no login, so nothing should reach it from another machine until
# you have added both and put TLS in front. Change the credentials here and in
# deploy/.env.prod together before running anywhere real.

name: beak-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: beak
      POSTGRES_PASSWORD: beak
      POSTGRES_DB: beak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beak"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped

  # Schema + seed via the worm CLI bundled in the server image. Behind "setup".
  #   ... run --rm migrate            -> creates the schema
  #   ... run --rm migrate db:seed    -> seeds demo data
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: beak-server
    profiles: ["setup"]
    env_file: [.env.prod]
    entrypoint: ["/opt/beak/migrate/bin/migrate"]
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: beak-server
    env_file: [.env.prod]
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["uploads:/data/uploads"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: beak-web
    ports: ["127.0.0.1:8090:80"]
    depends_on: [server]
    restart: unless-stopped

volumes:
  pgdata: {}
  uploads: {}
