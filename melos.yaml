name: beak

packages:
  - packages/**
  - examples/**

# The worm ORM and its drivers are vendored ("given"), so they are consumed as
# path dependencies and kept out of the melos gate: `melos exec` would run
# `dart analyze` and `dart test` over an upstream tree this repo does not own.
# They are still edited here, so `melos run test-worm` runs their suites
# explicitly and CI calls it.
ignore:
  - packages/worm
  - packages/worm/**
  - packages/worm_*
  - packages/worm_*/**
  # A real Serverpod 4 workspace (one pub resolution for all its members,
  # Serverpod's exact pins, its own CI job). Melos must neither bootstrap nor
  # gate its members.
  - examples/serverpod
  - examples/serverpod/**

command:
  bootstrap:
    runPubGetInParallel: true
    # NOTE: deliberately no `dependencyOverridePaths` for obers_ui. Melos 6
    # applies those overrides to *every* workspace package, which drags the
    # Flutter SDK into the pure-Dart ones (beak_core, beak_cli, beak_image,
    # beak_storage_*) and makes `dart pub get` there require Flutter.
    # Beak pins obers_ui by git commit instead; to work against a local
    # checkout, run `melos run link-obers-ui`.

scripts:
  analyze:
    run: >-
      melos run analyze-dart &&
      melos run analyze-flutter &&
      melos run analyze-root &&
      melos run guard-material &&
      melos run guard-web &&
      melos run check-docs &&
      melos run check-examples
    description: Static analysis across all packages (0 issues required).
  analyze-dart:
    run: melos exec -- "dart analyze --fatal-infos --fatal-warnings ."
    description: Static analysis for pure-Dart packages.
    packageFilters: { flutter: false }
  analyze-flutter:
    run: melos exec -- "flutter analyze --fatal-infos --fatal-warnings"
    description: Static analysis for Flutter packages.
    packageFilters: { flutter: true }
  analyze-root:
    # `melos bootstrap` resolves packages/** and examples/**, not the workspace
    # root — and `dart analyze`, unlike `dart test`/`dart run`, does not fetch
    # on its own. Resolving here (a no-op once resolved) is what makes
    # `melos run analyze` work on a fresh clone with no extra step.
    run: >-
      dart pub get &&
      dart analyze --fatal-infos --fatal-warnings tool &&
      dart analyze --fatal-infos --fatal-warnings test
    description: Static analysis for the workspace tooling (tool/ and its tests).
  check-examples:
    # Runs the real `beak doctor` in each example. The examples are the only
    # end-to-end exercise of the generator, and nothing else in the gate
    # notices when an emitter change leaves one stale — analyze and test both
    # run against whatever is checked in.
    run: dart run tool/check_examples.dart
    description: >-
      FAIL when an example's generated code is stale, a model has no
      migration, or a panel file reaches the server.
  check-docs:
    run: dart run tool/check_docs.dart
    description: >-
      FAIL when a docs page claims a file that does not exist, has no front
      matter, or uses a phrase the style guide bans.
  guard-material:
    run: dart run tool/check_no_material.dart
    description: >-
      FAIL on any package:flutter/material.dart or package:flutter/cupertino.dart
      import in Beak code.
  guard-web:
    run: dart run tool/check_web_safe.dart
    description: >-
      FAIL when the panel-side import graph (beak_core, beak_frontend) reaches
      dart:io or server-side packages. dart:io compiles on web and throws at
      runtime, so only this guard catches it.
  link-obers-ui:
    run: dart run tool/link_obers_ui.dart && melos bootstrap
    description: >-
      Point the obers_ui git deps at a sibling ../obers_ui checkout, for
      working on both repos at once. `melos run link-obers-ui -- --unlink`
      restores the pinned commits.
  format-check:
    run: dart format --output=none --set-exit-if-changed .
    description: Formatting must be clean.
  test:
    run: >-
      melos run test-dart &&
      melos run test-flutter &&
      melos run test-root
    description: Run every package's tests (pure Dart + Flutter + workspace tooling).
  test-dart:
    run: melos exec --fail-fast -- "dart test --coverage=coverage --exclude-tags e2e"
    description: Run pure-Dart package tests with coverage.
    packageFilters: { flutter: false, dirExists: test }
  test-flutter:
    run: melos exec --fail-fast -- "flutter test --coverage --exclude-tags e2e"
    description: Run Flutter package tests with coverage.
    packageFilters: { flutter: true, dirExists: test }
  test-e2e:
    # The suites that need `melos run up`: Postgres, MinIO. Everything they
    # assert also runs on SQLite in the main gate, so this is the driver
    # check, not the feature check.
    run: melos run test-e2e-dart && melos run test-e2e-flutter
    description: Run the service-backed suites (needs `melos run up`).
  test-e2e-dart:
    # The filters live on `exec` rather than in `packageFilters`, so running
    # these directly does not prompt for a package.
    run: >-
      melos exec --fail-fast --no-flutter --dir-exists=test/e2e --
      "dart test test/e2e --tags e2e"
    description: Service-backed suites of the pure-Dart packages.
  test-e2e-flutter:
    run: >-
      melos exec --fail-fast --flutter --dir-exists=test/e2e --
      "flutter test test/e2e --tags e2e"
    description: Service-backed suites of the Flutter packages.
  test-worm:
    # worm and its drivers are vendored and sit outside the melos scope (see
    # `ignore:` above), so `melos run test` never reaches them. They are still
    # edited here: the schema compilers, the adapter contract and the
    # descriptor union all live in this tree, and a change to one of them is
    # invisible to every other gate.
    run: melos run test-worm-local && melos run test-worm-postgres
    description: Run the vendored worm packages' suites.
  test-worm-local:
    # Every vendored package with a test directory except worm_postgres, which
    # needs a server and runs below. worm_mysql and worm_mongodb self-skip
    # without their own env vars and still cover their compilers and error
    # mappers.
    #
    # `performance` is excluded because those are wall-clock assertions, and a
    # shared CI runner is exactly where a wall-clock budget produces a red
    # build that means nothing. `melos run test-worm-performance` runs them.
    run: >-
      for pkg in worm worm_generator worm_lints worm_mongodb worm_mysql
      worm_sqlite; do
        (cd "packages/$pkg" && dart pub get > /dev/null &&
         dart test --exclude-tags performance) || exit 1;
      done
    description: Run the vendored packages' service-free suites.
  test-worm-performance:
    # Wall-clock and query-count benchmarks, on a machine you trust. Not part
    # of `test-worm`, so CI never fails on someone else's noisy runner.
    run: cd packages/worm && dart test --tags performance
    description: Run worm's benchmark assertions.
  test-worm-postgres:
    # Where ALTER TABLE and `EXPLAIN … USING INDEX` are proven against a real
    # server rather than a compiler golden. Until this ran they self-skipped
    # everywhere including CI.
    #
    # `?sslmode=disable` is required by the postgres package's own URL parser
    # against a server without TLS; the local compose instance has none.
    run: >-
      cd packages/worm_postgres && dart pub get &&
      PG_DB="${PG_DB:-postgres://beak:beak@localhost:25432/beak?sslmode=disable}"
      dart test
    description: Run the vendored Postgres driver's service-backed suite.
  test-root:
    run: dart test
    description: Run the workspace tooling self-checks (coverage gate, guards).
  coverage:
    run: dart run tool/check_coverage.dart
    description: Enforce per-package line-coverage thresholds.
  up:
    run: docker compose up -d --wait && docker compose run --rm createbuckets
    description: Start Postgres + MinIO, wait for health, and init the upload bucket.
  down:
    run: docker compose down -v
    description: Stop Postgres + MinIO and drop their volumes.
  license-sync:
    run: >-
      for pkg in packages/beak_*; do cp LICENSE "$pkg/LICENSE"; done &&
      echo "Synced the Apache-2.0 LICENSE into every publishable package."
    description: Copy the root LICENSE into each publishable beak_* package.
