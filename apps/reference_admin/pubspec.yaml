name: reference_admin
description: >-
  Beak reference admin app — Products/Users/Orders/Category/Tag demo panel.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: '>=3.41.0'

dependencies:
  beak_core:
    path: ../../packages/beak_core
  beak_frontend:
    path: ../../packages/beak_frontend
  # See packages/beak_frontend/pubspec.yaml for why this is pinned by commit.
  obers_ui:
    git:
      url: https://github.com/SimonErich/obers_ui.git
      ref: 9fad953d77e90d2aaf2399a7b1b2085c5dd504ca
  reference_admin_models:
    path: ../reference_admin_models
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  go_router: ^17.3.0
  lints: ^6.0.0
