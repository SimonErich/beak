name: reference_admin_server
description: Shelf server binary for the Beak reference admin app.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  beak_backend:
    path: ../../packages/beak_backend
  beak_core:
    path: ../../packages/beak_core
  reference_admin_models:
    path: ../reference_admin_models
  worm:
    path: ../../packages/worm

dev_dependencies:
  http: ^1.6.0
  image: ^4.9.1
  lints: ^6.0.0
  test: ^1.25.6

# beak_backend transitively depends on beak_storage_s3, whose minio 3.5.8
# pins xml ^6, but this package's image dev-dependency needs xml ^7; minio's
# xml use is xml-7-compatible (proven by beak_backend's MinIO integration
# suite). Mirrors the override in beak_backend and beak_superdashboard.
dependency_overrides:
  xml: ^7.0.1
